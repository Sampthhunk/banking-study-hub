
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test B5 – PSBs, Mergers & Nationalization</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#200122,#6f0000);min-height:100vh;color:#fff;padding:20px}.container{max-width:750px;margin:0 auto}.header{text-align:center;padding:20px;background:rgba(0,0,0,.3);border-radius:16px;margin-bottom:20px;border:1px solid rgba(255,255,255,.1)}.header h1{font-size:1.4em;background:linear-gradient(90deg,#f5af19,#f12711);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header p{color:#aaa;margin-top:5px;font-size:.9em}.progress-container{background:rgba(255,255,255,.1);border-radius:20px;height:10px;margin:20px 0;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#f5af19,#f12711);border-radius:20px;transition:width .4s}.stats{display:flex;justify-content:space-between;font-size:.85em;color:#ccc;margin-bottom:15px}.card{background:rgba(0,0,0,.25);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,.1);margin-bottom:20px}.q-num{font-size:.8em;color:#f5af19;font-weight:700;margin-bottom:8px}.q-text{font-size:1.05em;line-height:1.5;margin-bottom:20px}.option{display:block;width:100%;padding:14px 18px;margin:8px 0;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:.95em;cursor:pointer;text-align:left;transition:all .2s}.option:hover:not(.disabled){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}.option.correct{background:rgba(0,200,83,.15);border-color:#00c853;color:#69f0ae}.option.wrong{background:rgba(255,23,68,.15);border-color:#ff1744;color:#ff5252}.option.disabled{cursor:default;opacity:.7}.explanation{margin-top:15px;padding:15px;background:rgba(255,215,0,.08);border-left:3px solid #ffd200;border-radius:0 8px 8px 0;font-size:.9em;color:#ddd;display:none}.btn-row{display:flex;gap:10px;justify-content:center;margin-top:15px}.btn{padding:12px 30px;border:none;border-radius:10px;font-size:.95em;font-weight:600;cursor:pointer}.btn-next{background:linear-gradient(90deg,#f5af19,#f12711);color:#fff}.result-card{text-align:center;padding:40px}.score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;font-size:2em;font-weight:700}.score-good{background:rgba(0,200,83,.15);border:3px solid #00c853;color:#69f0ae}.score-avg{background:rgba(255,215,0,.15);border:3px solid #ffd200;color:#ffd200}.score-low{background:rgba(255,23,68,.15);border:3px solid #ff1744;color:#ff5252}.result-table{width:100%;margin-top:25px;border-collapse:collapse;font-size:.85em}.result-table th{padding:10px;background:rgba(255,255,255,.1);text-align:left}.result-table td{padding:8px 10px}.review-q{padding:15px;margin:10px 0;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1)}.review-q.r-correct{border-left:4px solid #00c853}.review-q.r-wrong{border-left:4px solid #ff1744}.hidden{display:none}.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:600}.tag-psb{background:rgba(245,175,25,.2);color:#f5af19}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🏛️ Test B5 – PSBs, Mergers & Nationalization</h1><p>Set B • Q121–Q150 of 307 • IBPS/SBI/RRB Mains</p><p><span class="tag tag-psb">BANKING</span></p></div>
<div id="quiz-area">
<div class="progress-container"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<div class="stats"><span id="qcount">Q 1/30</span><span id="scorecount">Score: 0</span></div>
<div class="card" id="qcard"></div>
<div class="btn-row"><button class="btn btn-next hidden" id="nextBtn" onclick="nextQ()">Next →</button></div>
</div>
<div id="result-area" class="hidden"></div>
</div>
<script>
const Q=[
{q:"Bank of Calcutta, Bombay, and Madras merged in 1921 to form:",o:["Imperial Bank of India","Bank of Hindustan","RBI","General Bank of India"],a:0,e:"Three Presidency Banks merged to form Imperial Bank of India."},
{q:"Imperial Bank became SBI in:",o:["1955","1954","1953","1950"],a:0,e:"Renamed on 1 July 1955 under the SBI Act, 1955."},
{q:"First private sector bank during RBI's liberalisation:",o:["HDFC Bank","PNB","ICICI Bank","SBI"],a:0,e:"HDFC Bank was the first (1994)."},
{q:"First bank to introduce ATM in India:",o:["SBI","HSBC","ICICI","IDFC"],a:1,e:"HSBC installed the first ATM in India in 1987."},
{q:"How many PSBs are in India (2025)?",o:["22","23","12","14"],a:2,e:"India has 12 PSBs after the 2019-20 mega mergers."},
{q:"Largest commercial bank in India:",o:["ICICI Bank","HDFC Bank","SBI","PNB"],a:2,e:"SBI is the largest commercial bank in India."},
{q:"SBI is headquartered in:",o:["New Delhi","Kolkata","Mumbai","Chennai"],a:2,e:"SBI is headquartered in Mumbai."},
{q:"SBI's tagline is:",o:["Together We Can","The Name You Can Bank Upon","Pure Banking Nothing Else","Good People to Bank With"],a:2,e:"SBI: 'Pure Banking Nothing Else'."},
{q:"PNB is headquartered in:",o:["Chandigarh","Amritsar","New Delhi","Lucknow"],a:2,e:"PNB HQ is in New Delhi."},
{q:"'Together We Can' is the tagline of:",o:["Union Bank","Bank of Baroda","Canara Bank","Indian Bank"],a:2,e:"Canara Bank: 'Together We Can'."},
{q:"'India's International Bank' is the tagline of:",o:["SBI","Bank of India","Bank of Baroda","EXIM Bank"],a:2,e:"Bank of Baroda: 'India's International Bank'."},
{q:"Bank of Baroda HQ is in:",o:["Mumbai","Ahmedabad","Vadodara, Gujarat","Surat"],a:2,e:"Bank of Baroda is in Vadodara, Gujarat."},
{q:"Canara Bank is headquartered in:",o:["Chennai","Mumbai","Bengaluru","Hyderabad"],a:2,e:"Canara Bank HQ is in Bengaluru."},
{q:"UCO Bank is headquartered in:",o:["Mumbai","Chennai","Kolkata","New Delhi"],a:2,e:"UCO Bank HQ is in Kolkata."},
{q:"'Central to You Since 1911' belongs to:",o:["Central Bank of India","Bank of India","Indian Bank","RBI"],a:0,e:"Central Bank of India's tagline."},
{q:"UCO Bank's tagline is:",o:["Good People to Bank With","Where Every Individual is Committed","Honours Your Trust","Faithful And Friendly"],a:2,e:"UCO Bank: 'Honours Your Trust'."},
{q:"Union Bank of India HQ:",o:["Mumbai","Kolkata","Lucknow","Mangalore"],a:0,e:"Union Bank of India is in Mumbai."},
{q:"Union Bank of India's tagline:",o:["Your Own Bank","Good People to Bank With","Relationship Beyond Banking","Honours Your Trust"],a:1,e:"Union Bank: 'Good People to Bank With'."},
{q:"Dena Bank and Vijaya Bank merged into (1 April 2019):",o:["PNB","Canara Bank","Bank of Baroda","Union Bank"],a:2,e:"Merged into Bank of Baroda."},
{q:"Syndicate Bank was merged into:",o:["Bank of Baroda","Indian Bank","Canara Bank","Union Bank"],a:2,e:"Syndicate Bank merged into Canara Bank."},
{q:"Allahabad Bank was merged into:",o:["PNB","Indian Bank","Union Bank","Canara Bank"],a:1,e:"Allahabad Bank merged into Indian Bank."},
{q:"OBC and United Bank merged into:",o:["Bank of Baroda","Canara Bank","PNB","Union Bank"],a:2,e:"OBC + United Bank merged into PNB."},
{q:"Andhra Bank and Corporation Bank merged into:",o:["Indian Bank","Canara Bank","PNB","Union Bank of India"],a:3,e:"Merged into Union Bank of India."},
{q:"Before 2019-20 mega mergers, India had how many PSBs?",o:["21","25","27","30"],a:2,e:"India had 27 PSBs before the mergers."},
{q:"SBI merged 5 associates + Bharatiya Mahila Bank on:",o:["1 April 2016","1 April 2017","1 April 2018","1 April 2019"],a:1,e:"SBI merged them on 1 April 2017."},
{q:"How many banks nationalized in 1969?",o:["6","10","14","20"],a:2,e:"14 banks with deposits over ₹50 crore."},
{q:"PM during first bank nationalization (1969):",o:["Nehru","Lal Bahadur Shastri","Indira Gandhi","Morarji Desai"],a:2,e:"Indira Gandhi was PM in 1969."},
{q:"Banks with deposits above ___ were nationalized in 1969:",o:["₹25 Cr","₹50 Cr","₹100 Cr","₹200 Cr"],a:1,e:"Deposits above ₹50 Crore."},
{q:"How many banks nationalized in 1980?",o:["4","6","8","10"],a:1,e:"6 more banks nationalized on 15 April 1980."},
{q:"Banks with deposits above ___ were nationalized in 1980:",o:["₹50 Cr","₹100 Cr","₹200 Cr","₹500 Cr"],a:2,e:"Deposits above ₹200 Crore in 1980."}
];
let ci=0,score=0,answered=[];
function render(){const q=Q[ci];document.getElementById("pbar").style.width=((ci/Q.length)*100)+"%";document.getElementById("qcount").textContent=`Q ${ci+1}/${Q.length}`;document.getElementById("scorecount").textContent=`Score: ${score}`;let h=`<div class="q-num">Q${ci+1} of ${Q.length}</div><div class="q-text">${q.q}</div>`;q.o.forEach((o,i)=>{h+=`<button class="option" onclick="pick(${i})">${String.fromCharCode(65+i)}) ${o}</button>`;});h+=`<div class="explanation" id="expl">💡 ${q.e}</div>`;document.getElementById("qcard").innerHTML=h;document.getElementById("nextBtn").classList.add("hidden");}
function pick(i){if(document.querySelector(".option.disabled"))return;const q=Q[ci];document.querySelectorAll(".option").forEach((b,j)=>{b.classList.add("disabled");if(j===q.a)b.classList.add("correct");if(j===i&&i!==q.a)b.classList.add("wrong");});if(i===q.a)score++;answered.push({qi:ci,sel:i,correct:i===q.a});document.getElementById("expl").style.display="block";document.getElementById("nextBtn").classList.remove("hidden");document.getElementById("scorecount").textContent=`Score: ${score}`;}
function nextQ(){ci++;if(ci>=Q.length){showResult();return;}render();}
function showResult(){document.getElementById("quiz-area").classList.add("hidden");const pct=Math.round((score/Q.length)*100);let cls=pct>=80?"score-good":pct>=50?"score-avg":"score-low";let grade=pct>=80?"🏆 Expert":pct>=65?"👍 Intermediate":pct>=50?"📘 Beginner":"🔄 Retry";let h=`<div class="card result-card"><h2>Test B5 Complete!</h2><div class="score-circle ${cls}">${pct}%</div><p style="font-size:1.2em">${score}/${Q.length}</p><p style="color:#aaa;margin:10px 0">${grade}</p><table class="result-table"><tr><th>Metric</th><th>Value</th></tr><tr><td>✅ Correct</td><td>${score}</td></tr><tr><td>❌ Wrong</td><td>${Q.length-score}</td></tr><tr><td>📊 Accuracy</td><td>${pct}%</td></tr></table></div><h3 style="margin:20px 0 10px">📝 Review</h3>`;answered.forEach((a,i)=>{const q=Q[a.qi];h+=`<div class="review-q ${a.correct?'r-correct':'r-wrong'}"><strong>Q${i+1}.</strong> ${q.q}<br><span style="color:${a.correct?'#69f0ae':'#ff5252'}">You: ${String.fromCharCode(65+a.sel)}) ${q.o[a.sel]}</span>`;if(!a.correct)h+=`<br><span style="color:#69f0ae">✅ ${String.fromCharCode(65+q.a)}) ${q.o[q.a]}</span>`;h+=`<br><small style="color:#aaa">💡 ${q.e}</small></div>`;});h+=`<div class="btn-row" style="margin:30px 0"><button class="btn btn-next" onclick="location.reload()">🔄 Retry</button></div>`;document.getElementById("result-area").innerHTML=h;document.getElementById("result-area").classList.remove("hidden");}
render();
</script>
</body>
</html>
