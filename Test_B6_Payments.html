
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test B6 – Payment Systems</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0b486b,#f56217);min-height:100vh;color:#fff;padding:20px}.container{max-width:750px;margin:0 auto}.header{text-align:center;padding:20px;background:rgba(0,0,0,.35);border-radius:16px;margin-bottom:20px;border:1px solid rgba(255,255,255,.1)}.header h1{font-size:1.4em;background:linear-gradient(90deg,#f56217,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header p{color:#aaa;margin-top:5px;font-size:.9em}.progress-container{background:rgba(255,255,255,.1);border-radius:20px;height:10px;margin:20px 0;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#f56217,#ffd200);border-radius:20px;transition:width .4s}.stats{display:flex;justify-content:space-between;font-size:.85em;color:#ccc;margin-bottom:15px}.card{background:rgba(0,0,0,.3);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,.1);margin-bottom:20px}.q-num{font-size:.8em;color:#f56217;font-weight:700;margin-bottom:8px}.q-text{font-size:1.05em;line-height:1.5;margin-bottom:20px}.option{display:block;width:100%;padding:14px 18px;margin:8px 0;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:.95em;cursor:pointer;text-align:left;transition:all .2s}.option:hover:not(.disabled){background:rgba(255,255,255,.12)}.option.correct{background:rgba(0,200,83,.15);border-color:#00c853;color:#69f0ae}.option.wrong{background:rgba(255,23,68,.15);border-color:#ff1744;color:#ff5252}.option.disabled{cursor:default;opacity:.7}.explanation{margin-top:15px;padding:15px;background:rgba(255,215,0,.08);border-left:3px solid #ffd200;border-radius:0 8px 8px 0;font-size:.9em;color:#ddd;display:none}.btn-row{display:flex;gap:10px;justify-content:center;margin-top:15px}.btn{padding:12px 30px;border:none;border-radius:10px;font-size:.95em;font-weight:600;cursor:pointer}.btn-next{background:linear-gradient(90deg,#f56217,#ffd200);color:#000}.result-card{text-align:center;padding:40px}.score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;font-size:2em;font-weight:700}.score-good{background:rgba(0,200,83,.15);border:3px solid #00c853;color:#69f0ae}.score-avg{background:rgba(255,215,0,.15);border:3px solid #ffd200;color:#ffd200}.score-low{background:rgba(255,23,68,.15);border:3px solid #ff1744;color:#ff5252}.result-table{width:100%;margin-top:25px;border-collapse:collapse;font-size:.85em}.result-table th{padding:10px;background:rgba(255,255,255,.1);text-align:left}.result-table td{padding:8px 10px}.review-q{padding:15px;margin:10px 0;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1)}.review-q.r-correct{border-left:4px solid #00c853}.review-q.r-wrong{border-left:4px solid #ff1744}.hidden{display:none}.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:600}.tag-pay{background:rgba(245,98,23,.2);color:#f56217}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>💳 Test B6 – Payment Systems</h1><p>Set B • Q151–Q180 of 307 • IBPS/SBI/RRB Mains</p><p><span class="tag tag-pay">PAYMENTS</span></p></div>
<div id="quiz-area">
<div class="progress-container"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<div class="stats"><span id="qcount">Q 1/30</span><span id="scorecount">Score: 0</span></div>
<div class="card" id="qcard"></div>
<div class="btn-row"><button class="btn btn-next hidden" id="nextBtn" onclick="nextQ()">Next →</button></div>
</div>
<div id="result-area" class="hidden"></div>
</div>
<script>
const Q=[
{q:"NEFT stands for:",o:["National Electronic Fund Transfer","National Electronic Funds Transfer","National Easy Fund Transfer","Net Electronic Funds Transfer"],a:1,e:"NEFT = National Electronic Funds Transfer."},
{q:"RTGS stands for:",o:["Real Time Global Settlement","Real Time Gross Settlement","Real Term Gross Settlement","Remote Transfer Gross Settlement"],a:1,e:"RTGS = Real Time Gross Settlement."},
{q:"RTGS settles transactions on:",o:["End-of-day net basis","Real-time individual basis","Weekly batch basis","Monthly clearing"],a:1,e:"RTGS settles each transaction individually in real time."},
{q:"Minimum amount for RTGS:",o:["₹50,000","₹1,00,000","₹2,00,000","No minimum"],a:2,e:"Minimum RTGS amount is ₹2,00,000."},
{q:"Instant interbank transfer through mobile is:",o:["NEFT","RTGS","IMPS","SWIFT"],a:2,e:"IMPS = Immediate Payment Service."},
{q:"IMPS stands for:",o:["Immediate Payment Service","Instant Money Payment Service","Indian Mobile Payment System","Interbank Mobile Payment Service"],a:0,e:"IMPS = Immediate Payment Service."},
{q:"UPI stands for:",o:["Unified Payment Interface","Universal Payment Interface","Unified Payment Integration","United Payment Interface"],a:0,e:"UPI = Unified Payments Interface."},
{q:"BHIM App was launched on:",o:["30 December 2016","1 January 2017","15 August 2016","26 January 2017"],a:0,e:"Launched 30 December 2016 by PM Modi."},
{q:"BHIM App is available in how many languages?",o:["8","11","13","15"],a:1,e:"BHIM App supports 11 languages."},
{q:"SWIFT stands for:",o:["Society for Worldwide Internal Financial Telecom","Society for Worldwide Interbank Financial Telecommunication","System for Worldwide Interbank Fund Transfer","Society for Worldwide International Fund Transfer"],a:1,e:"SWIFT = Society for Worldwide Interbank Financial Telecommunication."},
{q:"SWIFT is used for:",o:["Domestic retail payments","International financial transactions","ATM operations","Mobile banking"],a:1,e:"SWIFT handles international financial messaging."},
{q:"IFSC is used for:",o:["Identity verification","Bank branch identification for fund transfers","Tax filing","Insurance claims"],a:1,e:"IFSC identifies bank branches for electronic transfers."},
{q:"IFSC code has how many characters?",o:["9","10","11","12"],a:2,e:"IFSC = 11 alphanumeric characters."},
{q:"5th character in IFSC code is always:",o:["A letter","A number","Zero (0)","Depends on bank"],a:2,e:"The 5th character is always '0'."},
{q:"MICR stands for:",o:["Magnetic Ink Currency Recognition","Magnetic Ink Character Recognition","Manual Ink Character Recognition","Machine Input Character Recognition"],a:1,e:"MICR = Magnetic Ink Character Recognition."},
{q:"CTS stands for:",o:["Cheque Transfer System","Cheque Truncation System","Central Transfer System","Central Transaction Settlement"],a:1,e:"CTS = Cheque Truncation System."},
{q:"A crossed cheque can be deposited only through:",o:["Any person","Cash counter","A bank account","Payee in person"],a:2,e:"Crossed cheques can only be credited via bank account."},
{q:"Cheque in circulation for more than 6 months is called:",o:["Post-dated cheque","Stale cheque","Bounced cheque","Bearer cheque"],a:1,e:"A stale cheque is older than 6 months."},
{q:"NACH stands for:",o:["National Automated Cheque Handling","National Automated Clearing House","National Auto Clearing Hub","National Account Clearing House"],a:1,e:"NACH = National Automated Clearing House."},
{q:"A Demand Draft is also known as:",o:["Promissory note","Banker's cheque","Bearer cheque","Traveller's cheque"],a:1,e:"DD is commonly called a Banker's Cheque."},
{q:"MMID stands for:",o:["Mobile Money Identification","Mobile Money Identifier","Money Market Identifier","Mobile Marketing ID"],a:1,e:"MMID = Mobile Money Identifier."},
{q:"How many digits in MMID?",o:["4","6","8","11"],a:1,e:"MMID has 6 digits."},
{q:"How many digits on a Debit Card?",o:["12","14","16","18"],a:2,e:"Standard debit card has 16 digits."},
{q:"NPCI stands for:",o:["National Payment Corporation of India","National Payments Corporation of India","National Payment Consortium of India","National Payment Centre of India"],a:1,e:"NPCI = National Payments Corporation of India."},
{q:"NPCI was incorporated in:",o:["2005","2006","2007","2008"],a:3,e:"NPCI was incorporated in December 2008."},
{q:"NPCI was promoted by:",o:["Ministry of Finance","SEBI","Reserve Bank of India","Indian Banks' Association"],a:2,e:"NPCI was promoted by RBI."},
{q:"White Label ATMs are operated by:",o:["Public Sector Banks","Private Banks","Non-banking entities","RBI"],a:2,e:"White Label ATMs are run by non-bank entities."},
{q:"India's first White Label ATM brand was:",o:["SBI Yono","Indicash","MicroATM","PayNearby"],a:1,e:"Indicash was India's first White Label ATM (27 June 2013)."},
{q:"First company to get White Label ATM license from RBI:",o:["Paytm","Tata Communications Payment Solutions","Muthoot Finance","India1"],a:1,e:"TCPSL received the first license."},
{q:"Indicash was first launched in which state?",o:["Delhi","Maharashtra","Tamil Nadu","Karnataka"],a:1,e:"Indicash launched in Maharashtra on 27 June 2013."}
];
let ci=0,score=0,answered=[];
function render(){const q=Q[ci];document.getElementById("pbar").style.width=((ci/Q.length)*100)+"%";document.getElementById("qcount").textContent=`Q ${ci+1}/${Q.length}`;document.getElementById("scorecount").textContent=`Score: ${score}`;let h=`<div class="q-num">Q${ci+1} of ${Q.length}</div><div class="q-text">${q.q}</div>`;q.o.forEach((o,i)=>{h+=`<button class="option" onclick="pick(${i})">${String.fromCharCode(65+i)}) ${o}</button>`;});h+=`<div class="explanation" id="expl">💡 ${q.e}</div>`;document.getElementById("qcard").innerHTML=h;document.getElementById("nextBtn").classList.add("hidden");}
function pick(i){if(document.querySelector(".option.disabled"))return;const q=Q[ci];document.querySelectorAll(".option").forEach((b,j)=>{b.classList.add("disabled");if(j===q.a)b.classList.add("correct");if(j===i&&i!==q.a)b.classList.add("wrong");});if(i===q.a)score++;answered.push({qi:ci,sel:i,correct:i===q.a});document.getElementById("expl").style.display="block";document.getElementById("nextBtn").classList.remove("hidden");document.getElementById("scorecount").textContent=`Score: ${score}`;}
function nextQ(){ci++;if(ci>=Q.length){showResult();return;}render();}
function showResult(){document.getElementById("quiz-area").classList.add("hidden");const pct=Math.round((score/Q.length)*100);let cls=pct>=80?"score-good":pct>=50?"score-avg":"score-low";let grade=pct>=80?"🏆 Expert":pct>=65?"👍 Intermediate":pct>=50?"📘 Beginner":"🔄 Retry";let h=`<div class="card result-card"><h2>Test B6 Complete!</h2><div class="score-circle ${cls}">${pct}%</div><p style="font-size:1.2em">${score}/${Q.length}</p><p style="color:#aaa;margin:10px 0">${grade}</p><table class="result-table"><tr><th>Metric</th><th>Value</th></tr><tr><td>✅ Correct</td><td>${score}</td></tr><tr><td>❌ Wrong</td><td>${Q.length-score}</td></tr><tr><td>📊 Accuracy</td><td>${pct}%</td></tr></table></div><h3 style="margin:20px 0 10px">📝 Review</h3>`;answered.forEach((a,i)=>{const q=Q[a.qi];h+=`<div class="review-q ${a.correct?'r-correct':'r-wrong'}"><strong>Q${i+1}.</strong> ${q.q}<br><span style="color:${a.correct?'#69f0ae':'#ff5252'}">You: ${String.fromCharCode(65+a.sel)}) ${q.o[a.sel]}</span>`;if(!a.correct)h+=`<br><span style="color:#69f0ae">✅ ${String.fromCharCode(65+q.a)}) ${q.o[q.a]}</span>`;h+=`<br><small style="color:#aaa">💡 ${q.e}</small></div>`;});h+=`<div class="btn-row" style="margin:30px 0"><button class="btn btn-next" onclick="location.reload()">🔄 Retry</button></div>`;document.getElementById("result-area").innerHTML=h;document.getElementById("result-area").classList.remove("hidden");}
render();
</script>
</body>
</html>
