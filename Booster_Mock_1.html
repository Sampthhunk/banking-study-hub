
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booster Mock 1</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;padding:10px}#top{background:#1a56db;color:#fff;padding:16px;border-radius:12px;text-align:center;margin-bottom:10px}#top h1{font-size:1.2em}#info{font-size:.95em;margin-top:6px}#nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:10px}#nav span{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#dbeafe;color:#1a56db;font-size:.72em;cursor:pointer;font-weight:700;border:2px solid transparent;position:relative}#nav span.g{background:#27ae60;color:#fff}#nav span.r{background:#e74c3c;color:#fff}#nav span.cur{border-color:#1a56db}#nav span.bk::after{content:'★';position:absolute;top:-6px;right:-4px;font-size:.55em;color:#f59e0b}.qc{background:#fff;border-radius:10px;margin-bottom:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:none}.qc.active{display:block}.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.qn{font-weight:700;color:#1e3a5f;font-size:.9em}.bm{background:none;border:2px solid #dbeafe;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:1em;color:#94a3b8}.bm.on{color:#f59e0b;border-color:#f59e0b}.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opt{padding:9px;background:#fff;border:2px solid #dbeafe;border-radius:8px;cursor:pointer;font-size:.82em;text-align:center;color:#1e3a5f;transition:.2s}.opt:hover{border-color:#1a56db;background:#eff6ff}.opt.c{background:#d4edda!important;border-color:#27ae60!important;color:#155724!important;font-weight:700}.opt.w{background:#f8d7da!important;border-color:#e74c3c!important;color:#721c24!important;font-weight:700}.opt.s{background:#d4edda!important;border-color:#27ae60!important;color:#155724!important}.opt.d{pointer-events:none;opacity:.6}.ex{background:#eff6ff;border-left:3px solid #1a56db;padding:6px 10px;margin-top:8px;font-size:.78em;color:#1e3a5f;display:none;border-radius:0 6px 6px 0}#bar{display:flex;gap:8px;justify-content:center;margin-top:10px}#bar button{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.85em}#pv{background:#dbeafe;color:#1a56db}#nx{background:#1a56db;color:#fff}#res{display:none;text-align:center;background:#fff;padding:20px;border-radius:12px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}#res h2{color:#1a56db;margin-bottom:8px}#res p{margin:4px 0;color:#1e3a5f}.rb{margin-top:12px;padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.9em}.rb1{background:#1a56db;color:#fff}.rb2{background:#dbeafe;color:#1a56db;margin-left:8px}#bmlist{display:none;background:#fff;padding:14px;border-radius:10px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}#bmlist h3{color:#f59e0b;margin-bottom:8px}.ft{text-align:center;color:#94a3b8;font-size:.72em;margin-top:12px}</style></head><body>
<div id="top"><h1>🎯 Booster Mock Test 1 — Schemes & Appointments</h1><div id="info">Score: <span id="sc">0</span>/30 | Q: <span id="qnum">1</span>/30 | 🔖 <span id="bc">0</span></div></div>
<div id="nav"></div><div id="qarea"></div>
<div id="bar"><button id="pv" onclick="go(-1)">◀ Prev</button><button id="nx" onclick="go(1)">Next ▶</button></div>

<div id="bmlist"><h3>🔖 Bookmarked Questions</h3><div id="bmqs"></div></div>
<div class="ft">IBPS/SBI/RRB Mains 2026 | Sampath Kumar</div>
<script>
var OQ=[
{q:"Manoj Mukund Naravane's autobiography?",o:["The Kargil Girl","Four Stars of Destiny","Wings of Fire","My Country My Life"],a:1,e:"IAS→Army Chief; 28th COAS"},
{q:"GeM signed MoU with CSC for?",o:["Banking","e-Marketplace access to rural areas","Education","Healthcare"],a:1,e:"Common Service Centres; rural procurement"},

{q:"PM-KISAN annual benefit?",o:["₹4,000","₹6,000","₹8,000","₹10,000"],a:1,e:"3 installments × ₹2,000 = ₹6,000/year"},
{q:"Atal Pension Yojana matures at age?",o:["55","58","60","65"],a:2,e:"₹1K-5K monthly; PFRDA; age 18-40"},
{q:"PMJDY overdraft facility up to?",o:["₹5,000","₹10,000","₹15,000","₹25,000"],a:1,e:"Zero balance; RuPay; ₹2L accident cover"},
{q:"PM Ujjwala Yojana provides free?",o:["Electricity","LPG connections","Water","Internet"],a:1,e:"BPL families; May 1, 2016"},
{q:"Sukanya Samriddhi Yojana is for?",o:["Senior citizens","Girl child (0-10)","Farmers","Women entrepreneurs"],a:1,e:"Beti Bachao Beti Padhao; 21yr maturity"},
{q:"Stand-Up India loan range?",o:["₹50K-₹5L","₹10L-₹1Cr","₹1Cr-₹10Cr","₹25K-₹50L"],a:1,e:"SC/ST & women; 1 per bank branch"},
{q:"PM MUDRA — Kishore category range?",o:["Up to ₹50K","₹50K-₹5L","₹5L-₹10L","₹10L-₹25L"],a:1,e:"Shishu≤50K; Kishore=50K-5L; Tarun=5L-10L"},
{q:"PM Suraksha Bima Yojana premium?",o:["₹12","₹20","₹330","₹436"],a:1,e:"Accident insurance; ₹2L death cover"},
{q:"PM Jeevan Jyoti Bima premium?",o:["₹20","₹150","₹436","₹500"],a:2,e:"Life insurance; ₹2L death; age 18-55"},
{q:"PM Vishwakarma Yojana for?",o:["Farmers","Traditional artisans","Students","Women"],a:1,e:"18 trades; ₹13K Cr; loan ₹3L"},
{q:"Jal Jeevan Mission target?",o:["Clean rivers","Tap water every rural home","Rainwater harvesting","Dam building"],a:1,e:"Har Ghar Jal; 55 lpcd"},
{q:"PM Fasal Bima — Kharif premium?",o:["1%","1.5%","2%","5%"],a:2,e:"Rabi=1.5%; Commercial=5%"},
{q:"Ayushman Bharat cover per family?",o:["₹1 Lakh","₹3 Lakh","₹5 Lakh","₹10 Lakh"],a:2,e:"PMJAY; world's largest; 10 Cr families"},
{q:"Swachh Bharat Mission launched on?",o:["Aug 15, 2014","Oct 2, 2014","Jan 26, 2015","Nov 1, 2014"],a:1,e:"Gandhi Jayanti; ODF mission"},
{q:"NEP 2020 school structure?",o:["10+2","5+3+3+4","6+3+3","4+4+4"],a:1,e:"Foundation+Preparatory+Middle+Secondary"},
{q:"Make in India launched in?",o:["2012","Sep 25, 2014","2016","2018"],a:1,e:"Lion logo; 25 sectors"},
{q:"Digital India launched in?",o:["2014","Jul 1, 2015","2016","2018"],a:1,e:"DigiLocker, UMANG, BharatNet"},
{q:"Start-up India launched on?",o:["Aug 15, 2015","Jan 16, 2016","Mar 1, 2016","Oct 2, 2015"],a:1,e:"Tax exemption; Fund of Funds ₹10K Cr"},
{q:"PM Surya Ghar — free units?",o:["100","200","300","500"],a:2,e:"Muft Bijli; rooftop solar; 1 Cr homes"},
{q:"Green Hydrogen Mission budget?",o:["₹10,000 Cr","₹19,744 Cr","₹25,000 Cr","₹50,000 Cr"],a:1,e:"5 MMT by 2030"},
{q:"PM Matsya Sampada Yojana for?",o:["Agriculture","Fisheries","Dairy","Poultry"],a:1,e:"Blue Revolution; ₹20,050 Cr"},
{q:"Soil Health Card launched?",o:["2012","2015","2018","2020"],a:1,e:"12 parameters; every 2 years"},
{q:"Khelo India launched in?",o:["2016","2018","2020","2015"],a:1,e:"Youth Games; ₹5L/yr per athlete"},
{q:"Vocal for Local launched during?",o:["Budget 2020","Atmanirbhar Bharat","Independence Day 2019","Republic Day 2021"],a:1,e:"Self-reliant India; ₹20L Cr"},
{q:"MUDRA Tarun max loan?",o:["₹5 Lakh","₹10 Lakh","₹15 Lakh","₹25 Lakh"],a:1,e:"₹5L-10L; business expansion"},
{q:"Mission Amrit Sarovar target?",o:["25,000","50,000","75,000","1,00,000"],a:1,e:"Ponds; water conservation; Apr 2022"}
];
var Q,cur=0,sc=0,ans,bk;
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function init(shuf){Q=shuf?shuffle(OQ):OQ.slice();cur=0;sc=0;ans=new Array(Q.length).fill(-1);bk=new Array(Q.length).fill(false);var n=document.getElementById('nav');n.innerHTML='';var a=document.getElementById('qarea');a.innerHTML='';document.getElementById('res').style.display='none';document.getElementById('bmlist').style.display='none';document.getElementById('sc').textContent='0';document.getElementById('bc').textContent='0';for(var i=0;i<Q.length;i++){var s=document.createElement('span');s.textContent=i+1;s.onclick=(function(x){return function(){cur=x;show()}})(i);n.appendChild(s);var d=document.createElement('div');d.className='qc';d.id='q'+i;var h='<div class="qh"><div class="qn">Q'+(i+1)+'. '+Q[i].q+'</div><button class="bm" onclick="togBM('+i+')" id="bm'+i+'" title="Bookmark">☆</button></div><div class="opts">';for(var j=0;j<4;j++)h+='<div class="opt" onclick="pick('+i+','+j+')">'+String.fromCharCode(65+j)+') '+Q[i].o[j]+'</div>';h+='</div><div class="ex" id="ex'+i+'">💡 '+Q[i].e+'</div>';d.innerHTML=h;a.appendChild(d)}show()}
function show(){document.querySelectorAll('.qc').forEach(function(e){e.classList.remove('active')});document.getElementById('q'+cur).classList.add('active');document.getElementById('qnum').textContent=cur+1;var ns=document.getElementById('nav').children;for(var i=0;i<ns.length;i++){ns[i].classList.remove('cur');if(i===cur)ns[i].classList.add('cur')}}
function togBM(i){bk[i]=!bk[i];var b=document.getElementById('bm'+i);b.textContent=bk[i]?'★':'☆';b.classList.toggle('on',bk[i]);var ns=document.getElementById('nav').children;ns[i].classList.toggle('bk',bk[i]);document.getElementById('bc').textContent=bk.filter(Boolean).length}
function pick(qi,oi){if(ans[qi]>=0)return;ans[qi]=oi;var opts=document.getElementById('q'+qi).querySelectorAll('.opt');for(var j=0;j<opts.length;j++)opts[j].classList.add('d');if(oi===Q[qi].a){opts[oi].classList.add('c');sc++;document.getElementById('nav').children[qi].classList.add('g')}else{opts[oi].classList.add('w');opts[Q[qi].a].classList.add('s');document.getElementById('nav').children[qi].classList.add('r')}document.getElementById('ex'+qi).style.display='block';document.getElementById('sc').textContent=sc;if(ans.every(function(x){return x>=0})){document.getElementById('res').style.display='block';document.getElementById('fs').textContent=sc;var p=Math.round(sc/Q.length*100);document.getElementById('fp').textContent=p;document.getElementById('grade').textContent=p>=80?'🌟 Expert! Mains Ready!':p>=65?'👍 Good! Keep Going!':'📚 Needs Practice!';document.getElementById('fb').textContent=bk.filter(Boolean).length}}
function go(d){cur+=d;if(cur<0)cur=0;if(cur>=Q.length)cur=Q.length-1;show()}
function retake(shuf){init(shuf)}
function showBM(){var el=document.getElementById('bmlist');var qs=document.getElementById('bmqs');qs.innerHTML='';var found=false;for(var i=0;i<Q.length;i++){if(bk[i]){found=true;qs.innerHTML+='<div style="background:#fffbeb;border-left:3px solid #f59e0b;padding:8px;margin:4px 0;border-radius:0 6px 6px 0;font-size:.82em"><b>Q'+(i+1)+'.</b> '+Q[i].q+'<br><span style="color:#27ae60;font-weight:700">✅ '+String.fromCharCode(65+Q[i].a)+') '+Q[i].o[Q[i].a]+'</span><br><span style="color:#1a56db;font-size:.85em">💡 '+Q[i].e+'</span></div>'}}if(!found)qs.innerHTML='<p style="color:#94a3b8">No bookmarked questions</p>';el.style.display='block'}
init(false);
</script></body></html>
