<script>
var qs=[
{q:"'Together We Can' is the tagline of:",o:["SBI","Union Bank of India","Canara Bank","Bank of Baroda"],a:2,e:"Canara Bank tagline is Together We Can."},
{q:"'Good People to Bank With' is the tagline of:",o:["Bank of India","Indian Overseas Bank","Union Bank of India","UCO Bank"],a:2,e:"Union Bank of India tagline: Good People to Bank With."},
{q:"Dena Bank and Vijaya Bank were merged with:",o:["SBI","PNB","Bank of Baroda","Canara Bank"],a:2,e:"Dena Bank + Vijaya Bank merged into Bank of Baroda on 1 April 2019."},
{q:"Oriental Bank of Commerce merged with:",o:["Bank of Baroda","Punjab National Bank","Canara Bank","Union Bank of India"],a:1,e:"OBC + United Bank of India merged into PNB on 1 April 2020."},
{q:"Syndicate Bank merged with which bank?",o:["Indian Bank","Canara Bank","Union Bank of India","SBI"],a:1,e:"Syndicate Bank merged into Canara Bank on 1 April 2020."},
{q:"Allahabad Bank merged with:",o:["PNB","SBI","Indian Bank","Canara Bank"],a:2,e:"Allahabad Bank merged into Indian Bank on 1 April 2020."},
{q:"Before the mega mergers, India had how many PSBs?",o:["12","20","21","27"],a:3,e:"Before mergers, India had 27 PSBs, reduced to 12 after 2019-2020."},

{q:"HDFC Bank was established in which year?",o:["1991","1993","1994","2003"],a:2,e:"HDFC Bank was established in 1994."},
{q:"Which bank has the tagline 'We Understand Your World'?",o:["ICICI Bank","HDFC Bank","Axis Bank","Kotak Mahindra Bank"],a:1,e:"HDFC Bank tagline: We Understand Your World."},
{q:"Where is UCO Bank headquartered?",o:["Mumbai","Pune","Kolkata","Chennai"],a:2,e:"UCO Bank is headquartered in Kolkata, West Bengal."},
{q:"'One Family One Bank' is the tagline of:",o:["UCO Bank","Bank of Maharashtra","Indian Bank","Central Bank of India"],a:1,e:"Bank of Maharashtra tagline: One Family One Bank."},
{q:"Bank of Baroda tagline is:",o:["Together We Can","India's International Bank","The Banker to Every Indian","Relationship Beyond Banking"],a:1,e:"Bank of Baroda tagline: India's International Bank."},
{q:"Where is Indian Overseas Bank headquartered?",o:["Mumbai","Kolkata","Chennai","Bengaluru"],a:2,e:"IOB is headquartered in Chennai, Tamil Nadu."},
{q:"Andhra Bank and Corporation Bank merged with:",o:["PNB","Bank of Baroda","Indian Bank","Union Bank of India"],a:3,e:"Andhra Bank + Corporation Bank merged into Union Bank of India on 1 April 2020."},
{q:"GST was introduced in India on:",o:["1 April 2017","1 July 2017","22 September 2025","1 January 2018"],a:1,e:"GST was introduced on 1 July 2017 (GST Day)."},
{q:"GST was introduced through which Constitutional Amendment?",o:["99th","100th","101st","102nd"],a:2,e:"101st Constitutional Amendment Act gave constitutional backing to GST."},
{q:"GST Council is constituted under which Article?",o:["Article 112","Article 245","Article 279A","Article 300A"],a:2,e:"Article 279A provides for the GST Council."},
{q:"Who chairs the GST Council?",o:["Prime Minister","RBI Governor","Union Finance Minister","SEBI Chairman"],a:2,e:"Union Finance Minister chairs the GST Council."},
{q:"GST 2.0 new slab structure effective from:",o:["1 July 2025","22 September 2025","1 January 2026","1 April 2026"],a:1,e:"GST 2.0 new slabs effective from 22 September 2025."},
{q:"How many slabs are there in GST 2.0?",o:["3","4","5","6"],a:1,e:"GST 2.0 has 4 slabs: 0%, 5%, 18%, 40%."},

{q:"CGST is collected by:",o:["State Government","Central Government","Both","UT Administration"],a:1,e:"CGST is collected by Central Government on intra-state transactions."},
{q:"IGST applies to:",o:["Intra-state transactions","Inter-state transactions","Union Territories only","Exports only"],a:1,e:"IGST applies to inter-state transactions."},

{q:"SAC Code in GST is used for:",o:["Product classification","Service classification","Tax audit","Return filing"],a:1,e:"SAC = Services Accounting Code for service classification."},
{q:"GST replaced how many indirect taxes?",o:["10","13","15","17"],a:3,e:"GST replaced 17 central and state indirect taxes."},
{q:"In GST 2.0, milk and fresh vegetables fall under:",o:["0%","5%","12%","18%"],a:0,e:"Milk, fresh fruits & vegetables are under 0% (NIL) slab."},
{q:"In GST, intra-state supplies are taxed with:",o:["IGST only","CGST + SGST","UTGST only","No tax"],a:1,e:"Intra-state supplies are taxed with CGST + SGST combined."},

var ans={},bk={},tot=qs.length,cor=0;
function render(list){var h='';list.forEach(function(q,i){var idx=qs.indexOf(q);h+='<div class="qc" id="q'+idx+'"><button class="bm'+(bk[idx]?' a':'')+'" onclick="toggleBk('+idx+')">🔖</button><div class="qn">Q'+(idx+1)+' of '+tot+'</div><div class="qt">'+q.q+'</div>';q.o.forEach(function(o,j){h+='<button class="ob" id="o'+idx+'_'+j+'" onclick="check('+idx+','+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>';});h+='<div class="ex" id="ex'+idx+'">💡 '+q.e+'</div></div>';});document.getElementById('qArea').innerHTML=h;for(var k in ans){var idx=parseInt(k),a=ans[k];document.querySelectorAll('#q'+idx+' .ob').forEach(function(b){b.style.pointerEvents='none';});document.getElementById('o'+idx+'_'+a).classList.add(a===qs[idx].a?'c':'w');document.getElementById('o'+idx+'_'+qs[idx].a).classList.add('sh');document.getElementById('ex'+idx).style.display='block';}}
function check(qi,oi){if(ans[qi]!==undefined)return;ans[qi]=oi;var isC=oi===qs[qi].a;if(isC)cor++;document.getElementById('o'+qi+'_'+oi).classList.add(isC?'c':'w');if(!isC)document.getElementById('o'+qi+'_'+qs[qi].a).classList.add('sh');document.getElementById('ex'+qi).style.display='block';document.querySelectorAll('#q'+qi+' .ob').forEach(function(b){b.style.pointerEvents='none';});document.getElementById('score').textContent=cor+'/'+tot;document.getElementById('pct').textContent=Math.round(cor/tot*100)+'%';localStorage.setItem('test_A2_last',JSON.stringify({s:cor,t:tot,d:new Date().toLocaleDateString()}));}
function toggleBk(i){bk[i]=!bk[i];document.querySelector('#q'+i+' .bm').classList.toggle('a');localStorage.setItem('bk_A2',JSON.stringify(bk));}
function shuffle(){qs=qs.slice().sort(function(){return Math.random()-0.5;});ans={};cor=0;document.getElementById('score').textContent='0/'+tot;document.getElementById('pct').textContent='0%';render(qs);}
function showBookmarked(){var b=qs.filter(function(q,i){return bk[qs.indexOf(q)];});if(!b.length){alert('No bookmarked questions yet!');return;}render(b);}

</script>
