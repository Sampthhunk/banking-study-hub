{q:"Press Freedom Index?",o:["UN","RSF","WEF","Amnesty"],a:1,t:"Heads",e:"Reporters Without Borders; Paris"},
{q:"World Competitiveness?",o:["WEF","IMD","World Bank","UN"],a:1,t:"Heads",e:"IMD Business School; Lausanne"}
];
var Q,cur=0,sc=0,ans,bk,timer,sec=1200,paused=false,best=+localStorage.getItem('gt2c')||0;
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(s){var m=Math.floor(s/60),ss=s%60;return(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss}
function startT(){clearInterval(timer);sec=1200;document.getElementById('tmr').classList.remove('warn');timer=setInterval(function(){if(!paused){sec--;document.getElementById('tmr').textContent='⏱️ '+fmt(sec);if(sec<=120)document.getElementById('tmr').classList.add('warn');if(sec<=0){clearInterval(timer);end()}}},1000)}
function togglePause(){paused=!paused;document.getElementById('pause').style.display=paused?'flex':'none'}
function init(){Q=sh(P.slice()).slice(0,30);cur=0;sc=0;ans=new Array(30).fill(-1);bk=new Array(30).fill(false);var n=document.getElementById('nav');n.innerHTML='';var a=document.getElementById('qarea');a.innerHTML='';document.getElementById('res').style.display='none';document.getElementById('weak').style.display='none';document.getElementById('bmlist').style.display='none';document.getElementById('sc').textContent='0';document.getElementById('bc').textContent='0';for(var i=0;i<30;i++){var s=document.createElement('span');s.textContent=i+1;s.onclick=(function(x){return function(){cur=x;show()}})(i);n.appendChild(s);var d=document.createElement('div');d.className='qc';d.id='q'+i;var h='<div class="qh"><div><span class="qn">Q'+(i+1)+'.</span> <span class="tp">'+Q[i].t+'</span></div><button class="bm" onclick="togBM('+i+')" id="bm'+i+'">☆</button></div><div class="qn" style="margin-bottom:8px">'+Q[i].q+'</div><div class="opts">';for(var j=0;j<4;j++)h+='<div class="opt" onclick="pk('+i+','+j+')">'+String.fromCharCode(65+j)+') '+Q[i].o[j]+'</div>';h+='</div><div class="ex" id="ex'+i+'">💡 '+Q[i].e+'</div>';d.innerHTML=h;a.appendChild(d)}show();startT();document.getElementById('best').textContent='🏅 Best:'+best+'/30'}
function show(){document.querySelectorAll('.qc').forEach(function(e){e.classList.remove('active')});document.getElementById('q'+cur).classList.add('active');document.getElementById('qnum').textContent=cur+1;var ns=document.getElementById('nav').children;for(var i=0;i<ns.length;i++){ns[i].classList.remove('cur');if(i===cur)ns[i].classList.add('cur')}}
function togBM(i){bk[i]=!bk[i];document.getElementById('bm'+i).textContent=bk[i]?'★':'☆';document.getElementById('bm'+i).classList.toggle('on',bk[i]);document.getElementById('nav').children[i].classList.toggle('bk',bk[i]);document.getElementById('bc').textContent=bk.filter(Boolean).length}
function pk(qi,oi){if(ans[qi]>=0)return;ans[qi]=oi;var opts=document.getElementById('q'+qi).querySelectorAll('.opt');for(var j=0;j<opts.length;j++)opts[j].classList.add('d');if(oi===Q[qi].a){opts[oi].classList.add('c');sc++;document.getElementById('nav').children[qi].classList.add('g')}else{opts[oi].classList.add('w');opts[Q[qi].a].classList.add('s');document.getElementById('nav').children[qi].classList.add('r')}document.getElementById('ex'+qi).style.display='block';document.getElementById('sc').textContent=sc}
function go(d){cur+=d;if(cur<0)cur=0;if(cur>=30)cur=29;show()}
function end(){clearInterval(timer);for(var i=0;i<30;i++){if(ans[i]<0){ans[i]=-2;var o=document.getElementById('q'+i).querySelectorAll('.opt');for(var j=0;j<o.length;j++)o[j].classList.add('d');o[Q[i].a].classList.add('s');document.getElementById('ex'+i).style.display='block';document.getElementById('nav').children[i].classList.add('r')}}if(sc>best){best=sc;localStorage.setItem('gt2c',best)}document.getElementById('res').style.display='block';document.getElementById('fs').textContent=sc;var p=Math.round(sc/30*100);document.getElementById('fp').textContent=p;document.getElementById('grade').textContent=p>=80?'🌟 Expert!':p>=65?'👍 Good!':'📚 Practice!';document.getElementById('fb').textContent=bk.filter(Boolean).length;document.getElementById('best').textContent='🏅 Best:'+best+'/30'}
function retake(){init()}
function showW(){var tp={};for(var i=0;i<30;i++){var t=Q[i].t;if(!tp[t])tp[t]={r:0,w:0};if(ans[i]>=0&&ans[i]===Q[i].a)tp[t].r++;else tp[t].w++}var tb=document.getElementById('wtb');tb.innerHTML='';var ts=Object.keys(tp).sort(function(a,b){return tp[a].r/(tp[a].r+tp[a].w)-tp[b].r/(tp[b].r+tp[b].w)});for(var k=0;k<ts.length;k++){var t=ts[k],d=tp[t],pc=Math.round(d.r/(d.r+d.w)*100);tb.innerHTML+='<tr><td>'+t+'</td><td style="color:#27ae60;font-weight:700">'+d.r+'</td><td style="color:#e74c3c;font-weight:700">'+d.w+'</td><td style="font-weight:700;color:'+(pc>=80?'#27ae60':pc>=60?'#f59e0b':'#e74c3c')+'">'+pc+'%</td></tr>'}document.getElementById('weak').style.display='block'}
function showBM(){var qs=document.getElementById('bmqs');qs.innerHTML='';var f=0;for(var i=0;i<30;i++){if(bk[i]){f=1;qs.innerHTML+='<div style="background:#eff6ff;border-left:3px solid #1a56db;padding:6px;margin:3px 0;font-size:.78em"><b>Q'+(i+1)+'.</b> '+Q[i].q+'<br><span style="color:#27ae60">✅ '+String.fromCharCode(65+Q[i].a)+') '+Q[i].o[Q[i].a]+'</span><br><span style="color:#1a56db">💡 '+Q[i].e+'</span></div>'}}if(!f)qs.innerHTML='<p style="color:#94a3b8">No bookmarks</p>';document.getElementById('bmlist').style.display='block'}
init();
</script></body></html>
