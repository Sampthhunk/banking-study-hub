<script>
var qs=[
{q:"When was the Reserve Bank of India established?",o:["1 April 1934","1 April 1935","1 January 1949","1 July 1955"],a:1,e:"RBI was established on 1 April 1935."},
{q:"RBI was established under which Act?",o:["Banking Regulation Act 1949","RBI Act 1934","Companies Act 1956","FEMA 1999"],a:1,e:"RBI was established under the Reserve Bank of India Act, 1934."},
{q:"Where was the original headquarters of RBI?",o:["Mumbai","New Delhi","Kolkata","Chennai"],a:2,e:"RBI was originally headquartered in Kolkata, shifted to Mumbai in 1937."},
{q:"When was RBI nationalized?",o:["1 April 1935","1 July 1955","1 January 1949","19 July 1969"],a:2,e:"RBI was nationalized on 1 January 1949."},
{q:"Who was the first Governor of RBI?",o:["C.D. Deshmukh","James Braid Taylor","Sir Osborne Smith","Benegal Rama Rau"],a:2,e:"Sir Osborne Smith (Australian) was the first RBI Governor (1935-1937)."},
{q:"Who was the first Indian Governor of RBI?",o:["Manmohan Singh","Sir Osborne Smith","Sir C.D. Deshmukh","Benegal Rama Rau"],a:2,e:"Sir C.D. Deshmukh was the first Indian Governor of RBI (1943-1949)."},
{q:"Who is the current (26th) Governor of RBI?",o:["Shaktikanta Das","Urjit Patel","Raghuram Rajan","Sanjay Malhotra"],a:3,e:"Sanjay Malhotra is the 26th and current RBI Governor since 11 Dec 2024."},
{q:"Which RBI Governor later became Prime Minister of India?",o:["C. Rangarajan","Manmohan Singh","I.G. Patel","Bimal Jalan"],a:1,e:"Manmohan Singh (15th Governor) later became Prime Minister."},
{q:"Who was the longest-serving RBI Governor?",o:["Sir Osborne Smith","C.D. Deshmukh","Benegal Rama Rau","Shaktikanta Das"],a:2,e:"Sir Benegal Rama Rau served 7+ years (1949-1957), the longest."},
{q:"Who was the shortest-serving RBI Governor?",o:["K.G. Ambegaonkar","Amitav Ghosh","M. Narasimham","B.N. Adarkar"],a:1,e:"Amitav Ghosh served only 20 days, the shortest tenure."},
{q:"How many Governors has RBI had till date?",o:["22","24","25","26"],a:3,e:"RBI has had 26 Governors till date."},
{q:"Repo Rate is the rate at which:",o:["Banks lend to public","RBI lends short-term to banks","RBI borrows from banks","Banks deposit with RBI"],a:1,e:"Repo Rate = Rate at which RBI lends short-term funds to commercial banks."},
{q:"Reverse Repo Rate is the rate at which:",o:["RBI lends to banks","Banks deposit funds with RBI","Banks lend to public","Government borrows from RBI"],a:1,e:"Reverse Repo Rate = Rate at which RBI borrows funds from commercial banks."},
{q:"CRR is the percentage of deposits banks must maintain as:",o:["Gold with RBI","Government securities","Cash with RBI","Loans to priority sector"],a:2,e:"CRR = Percentage of deposits banks must maintain as cash with RBI (earns no interest)."},
{q:"SLR requires banks to maintain deposits in:",o:["Cash only","Gold, govt securities, or approved securities","Foreign currency","Real estate"],a:1,e:"SLR = Banks must maintain deposits in gold, govt securities, or approved securities."},
{q:"MCLR replaced which rate from April 2016?",o:["Repo Rate","Bank Rate","Base Rate","Reverse Repo Rate"],a:2,e:"MCLR replaced Base Rate from April 2016."},
{q:"MSF (Marginal Standing Facility) is:",o:["Daily liquidity tool","Emergency overnight borrowing above repo rate","Long-term lending rate","Deposit rate"],a:1,e:"MSF = Emergency overnight borrowing window at a rate above repo rate."},
{q:"LAF consists of:",o:["CRR + SLR","Repo + Reverse Repo","Bank Rate + MSF","MCLR + Base Rate"],a:1,e:"LAF = Repo + Reverse Repo — daily liquidity management tool."},
{q:"RBI as Lender of Last Resort means:",o:["RBI lends to public","RBI provides emergency funds to banks facing liquidity crisis","RBI lends to government","RBI borrows from foreign banks"],a:1,e:"Lender of Last Resort = RBI provides emergency funds to banks in crisis."},
{q:"Who issues Rs 1 note/coin in India?",o:["RBI","Ministry of Finance","SBI","NABARD"],a:1,e:"Rs 1 note/coin is issued by Ministry of Finance. All other notes by RBI."},

{q:"Which is the largest bank in India?",o:["Punjab National Bank","Bank of Baroda","State Bank of India","Canara Bank"],a:2,e:"SBI is the largest bank in India."},
{q:"SBI traces its origin to which year?",o:["1806","1855","1900","1955"],a:0,e:"SBI traces its origin to 1806 (Bank of Calcutta)."},
{q:"SBI was established in which year?",o:["1935","1949","1955","1969"],a:2,e:"State Bank of India was established in 1955."},
{q:"Where is PNB headquartered?",o:["Mumbai","Kolkata","New Delhi","Chandigarh"],a:2,e:"PNB is headquartered in New Delhi."},
{q:"Where is Canara Bank headquartered?",o:["Mumbai","Chennai","Bengaluru","Pune"],a:2,e:"Canara Bank is headquartered in Bengaluru, Karnataka."},
{q:"The tagline of SBI is:",o:["The Name You Can Bank Upon","The Banker to Every Indian","Together We Can","Honours Your Trust"],a:1,e:"SBI tagline: The Banker to Every Indian / Pure Banking Nothing Else."},

];
var ans={},bk={},tot=qs.length,cor=0;
function render(list){var h='';list.forEach(function(q,i){var idx=qs.indexOf(q);h+='<div class="qc" id="q'+idx+'"><button class="bm'+(bk[idx]?' a':'')+'" onclick="toggleBk('+idx+')">🔖</button><div class="qn">Q'+(idx+1)+' of '+tot+'</div><div class="qt">'+q.q+'</div>';q.o.forEach(function(o,j){h+='<button class="ob" id="o'+idx+'_'+j+'" onclick="check('+idx+','+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>';});h+='<div class="ex" id="ex'+idx+'">💡 '+q.e+'</div></div>';});document.getElementById('qArea').innerHTML=h;for(var k in ans){var idx=parseInt(k),a=ans[k];document.querySelectorAll('#q'+idx+' .ob').forEach(function(b){b.style.pointerEvents='none';});document.getElementById('o'+idx+'_'+a).classList.add(a===qs[idx].a?'c':'w');document.getElementById('o'+idx+'_'+qs[idx].a).classList.add('sh');document.getElementById('ex'+idx).style.display='block';}}
function check(qi,oi){if(ans[qi]!==undefined)return;ans[qi]=oi;var isC=oi===qs[qi].a;if(isC)cor++;document.getElementById('o'+qi+'_'+oi).classList.add(isC?'c':'w');if(!isC)document.getElementById('o'+qi+'_'+qs[qi].a).classList.add('sh');document.getElementById('ex'+qi).style.display='block';document.querySelectorAll('#q'+qi+' .ob').forEach(function(b){b.style.pointerEvents='none';});document.getElementById('score').textContent=cor+'/'+tot;document.getElementById('pct').textContent=Math.round(cor/tot*100)+'%';var r={s:cor,t:tot,d:new Date().toLocaleDateString()};localStorage.setItem('test_A1_last',JSON.stringify(r));}
function toggleBk(i){bk[i]=!bk[i];document.querySelector('#q'+i+' .bm').classList.toggle('a');localStorage.setItem('bk_A1',JSON.stringify(bk));}
function shuffle(){var s=qs.slice().sort(function(){return Math.random()-0.5;});qs=s;ans={};cor=0;document.getElementById('score').textContent='0/'+tot;document.getElementById('pct').textContent='0%';render(qs);}
function showBookmarked(){var b=qs.filter(function(q,i){return bk[qs.indexOf(q)];});if(b.length===0){alert('No bookmarked questions yet!');return;}render(b);}
var saved=localStorage.getItem('bk_A1');if(saved)bk=JSON.parse(saved);
render(qs);
