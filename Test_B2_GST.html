
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test B2 – Budget Tail + GST Fundamentals</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d);min-height:100vh;color:#fff;padding:20px}
.container{max-width:750px;margin:0 auto}
.header{text-align:center;padding:20px;background:rgba(0,0,0,.3);border-radius:16px;margin-bottom:20px;border:1px solid rgba(255,255,255,.1)}
.header h1{font-size:1.5em;background:linear-gradient(90deg,#ff416c,#ff4b2b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:#ccc;margin-top:5px;font-size:.9em}
.progress-container{background:rgba(255,255,255,.1);border-radius:20px;height:10px;margin:20px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#ff416c,#ff4b2b);border-radius:20px;transition:width .4s}
.stats{display:flex;justify-content:space-between;font-size:.85em;color:#ddd;margin-bottom:15px}
.card{background:rgba(0,0,0,.25);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.q-num{font-size:.8em;color:#ff416c;font-weight:700;margin-bottom:8px}
.q-text{font-size:1.05em;line-height:1.5;margin-bottom:20px}
.option{display:block;width:100%;padding:14px 18px;margin:8px 0;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:.95em;cursor:pointer;text-align:left;transition:all .2s}
.option:hover:not(.disabled){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.option.correct{background:rgba(0,200,83,.15);border-color:#00c853;color:#69f0ae}
.option.wrong{background:rgba(255,23,68,.15);border-color:#ff1744;color:#ff5252}
.option.disabled{cursor:default;opacity:.7}
.explanation{margin-top:15px;padding:15px;background:rgba(255,215,0,.08);border-left:3px solid #ffd200;border-radius:0 8px 8px 0;font-size:.9em;color:#eee;display:none}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:15px}
.btn{padding:12px 30px;border:none;border-radius:10px;font-size:.95em;font-weight:600;cursor:pointer;transition:all .2s}
.btn-next{background:linear-gradient(90deg,#ff416c,#ff4b2b);color:#fff}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(255,65,108,.4)}
.result-card{text-align:center;padding:40px}
.score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;font-size:2em;font-weight:700}
.score-good{background:rgba(0,200,83,.15);border:3px solid #00c853;color:#69f0ae}
.score-avg{background:rgba(255,215,0,.15);border:3px solid #ffd200;color:#ffd200}
.score-low{background:rgba(255,23,68,.15);border:3px solid #ff1744;color:#ff5252}
.result-table{width:100%;margin-top:25px;border-collapse:collapse;font-size:.85em}
.result-table th{padding:10px;background:rgba(255,255,255,.1);text-align:left}
.result-table td{padding:8px 10px}
.review-q{padding:15px;margin:10px 0;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1)}
.review-q.r-correct{border-left:4px solid #00c853}
.review-q.r-wrong{border-left:4px solid #ff1744}
.hidden{display:none}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:600;margin:2px}
.tag-b{background:rgba(247,151,30,.2);color:#ffd200}
.tag-g{background:rgba(0,200,83,.2);color:#69f0ae}
.badge-corr{font-size:.75em;padding:2px 8px;border-radius:10px;background:rgba(255,23,68,.2);color:#ff5252;margin-left:8px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🧾 Test B2 – Budget Tail + GST Fundamentals</h1>
<p>Set B (Re-Split) • Q31–Q60 of 307 • IBPS/SBI/RRB Mains 2026</p>
<p><span class="tag tag-b">BUDGET</span> <span class="tag tag-g">GST</span></p>
</div>
<div id="quiz-area">
<div class="progress-container"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<div class="stats"><span id="qcount">Question 1 / 30</span><span id="scorecount">Score: 0</span></div>
<div class="card" id="qcard"></div>
<div class="btn-row"><button class="btn btn-next hidden" id="nextBtn" onclick="nextQ()">Next →</button></div>
</div>
<div id="result-area" class="hidden"></div>
</div>
<script>
const Q=[
{q:"According to Union Budget 2023-24, the highest expenditure sector is:",o:["Subsidies","Defence","Centrally sponsored schemes","Interest payments"],a:3,e:"Interest payments represented the highest expenditure in 2023-24."},
{q:"As per Union Budget 2022-23, how many km of National Highways were planned?",o:["5,000 km","15,000 km","25,000 km","55,000 km"],a:2,e:"25,000 km of National Highways were planned in Budget 2022-23."},
{q:"Which of the following is an example of direct tax in India?",o:["Entertainment tax","Stamp & Registration fees","Sales tax","Corporation tax"],a:3,e:"Corporation tax is a direct tax levied on company profits."},
{q:"Which Prime Minister never presented the budget of India?",o:["Atal Bihari Vajpayee","Indira Gandhi","Manmohan Singh","Pt. Jawaharlal Nehru"],a:0,e:"Atal Bihari Vajpayee never presented the Union Budget."},
{q:"Three Prime Ministers who have presented Budgets are:",o:["Jawaharlal Nehru, Indira Gandhi, Rajiv Gandhi","Jawaharlal Nehru, Jagjivan Ram, Rajiv Gandhi","Jawaharlal Nehru, Lal Bahadur Shastri, Indira Gandhi","Indira Gandhi, Lal Bahadur Shastri, Rajiv Gandhi"],a:0,e:"Nehru, Indira Gandhi, and Rajiv Gandhi all presented Union Budgets."},
{q:"What is the full form of GST?",o:["Goods and Supply Tax","Government Sales Tax","Goods and Services Tax","General Sales Tax"],a:2,e:"GST = Goods and Services Tax."},
{q:"The headquarters of GST Council is located at:",o:["New Delhi","Mumbai","Noida","Ranchi"],a:0,e:"The GST Council headquarters is in New Delhi."},
{q:"What does 'I' stand for in IGST?",o:["Intra","International","Integrated","Internal"],a:2,e:"IGST = Integrated Goods and Services Tax."},
{q:"When was GST implemented in India?",o:["1 March 2017","1 April 2017","1 May 2017","1 July 2017"],a:3,e:"GST was implemented on 1 July 2017 (GST Day)."},
{q:"Who is known as the 'Father of GST in India'?",o:["Narendra Modi","Arun Jaitley","Nirmala Sitharaman","Pranab Mukherjee"],a:1,e:"Arun Jaitley is known as the Father of GST in India."},
{q:"Who was the first Chairman of the GST Council?",o:["Arun Jaitley","Manmohan Singh","Sushma Swaraj","Amit Shah"],a:0,e:"Arun Jaitley was the first Chairman of the GST Council."},
{q:"GST is based on which principle?",o:["Origin","Destination","Production","Consumption"],a:1,e:"GST is based on the Destination principle."},
{q:"India adopted which model of GST?",o:["Single GST","Dual GST","Triple GST","Unified GST"],a:1,e:"India adopted the Dual GST model (CGST + SGST)."},
{q:"How many digits are in a GST Number (GSTIN)?",o:["10","12","14","15"],a:3,e:"GSTIN contains 15 digits."},
{q:"How many members are there in the GST Council?",o:["33","35","37","39"],a:2,e:"The GST Council has 37 members."},
{q:"What is the maximum rate of GST?",o:["18%","24%","28%","30%"],a:2,e:"The maximum standard GST rate is 28%."},
{q:"Which Constitutional Amendment led to the introduction of GST?",o:["61st Amendment","101st Amendment","73rd Amendment","100th Amendment"],a:1,e:"The 101st Constitutional Amendment Act introduced GST."},
{q:"Which tax was subsumed (abolished) by the introduction of GST?",o:["Service Tax","Income Tax","Corporation Tax","Wealth Tax"],a:0,e:"Service Tax was subsumed into GST."},
{q:"GST Council is chaired by:",o:["President of India","Prime Minister of India","Union Finance Minister","RBI Governor"],a:2,e:"The Union Finance Minister chairs the GST Council (Article 279A)."},
{q:"Who first proposed the idea of a nationwide GST in India?",o:["Basel Committee","The Kelkar Task Force","Narasimham Committee","C. Rangarajan Committee"],a:1,e:"The Kelkar Task Force first proposed a nationwide GST."},
{q:"What benefit does the Input Tax Credit (ITC) mechanism provide?",o:["Avoids taxation on production","Avoids double taxation","Increases cost of goods","Applies only to state taxes"],a:1,e:"ITC avoids the cascading effect (double taxation)."},
{q:"Which was the first country to introduce GST?",o:["Canada","France","Australia","Germany"],a:1,e:"France was the first country to introduce GST in 1954."},
{q:"Which was the first state in India to ratify/pass the GST bill?",o:["Tamil Nadu","Assam","Madhya Pradesh","Kerala"],a:1,e:"Assam was the first state to pass the GST bill."},
{q:"What is the full form of GSTIN?",o:["GST Investment Number","GST Identification Note","GST Information Number","GST Identification Number"],a:3,e:"GSTIN = GST Identification Number."},
{q:"What is the full form of CGST?",o:["Central Goods and Serving Tax","Central Goods and Services Team","Central Goods and Services Tax","Central Goals and Services Tax"],a:2,e:"CGST = Central Goods and Services Tax."},
{q:"What is the full form of SGST?",o:["State Goods and Serving Tax","State Goals and Services Tax","Sahara Goods and Services Tax","State Goods and Services Tax"],a:3,e:"SGST = State Goods and Services Tax."},
{q:"What is the full form of UTGST?",o:["Union Territory Goods and Services Tax","United Territory Goods and Services Tax","Union Territory Goals and Services Tax","Union Territory Goods and Serving Tax"],a:0,e:"UTGST = Union Territory Goods and Services Tax."},
{q:"What does 'HSN' code stand for in GST?",o:["Harmonised System of Nomenclature","Harmonised Service of Nomenclature","Harmonised System of Nomenclature Case","Harmonised System of Nominee Code"],a:0,e:"HSN = Harmonised System of Nomenclature (classifies goods)."},
{q:"What does 'SAC' stand for in GST?",o:["Servicing Act Code","Serving Accounting Code","Services Accounting Code","System Accounting Code"],a:2,e:"SAC = Services Accounting Code (classifies services)."},
{q:"What is the full form of QRMP Scheme?",o:["Quarterly Return, Minimum Payment","Quarterly Return, Maximum Payment","Quarterly Return, Monthly Payment","Quarterly Return, Minimum Payout"],a:2,e:"QRMP = Quarterly Return, Monthly Payment scheme."}
];
let ci=0,score=0,answered=[];
function render(){const q=Q[ci];document.getElementById("pbar").style.width=((ci/Q.length)*100)+"%";document.getElementById("qcount").textContent=`Question ${ci+1} / ${Q.length}`;document.getElementById("scorecount").textContent=`Score: ${score}`;let h=`<div class="q-num">Q${ci+1} of ${Q.length}</div><div class="q-text">${q.q}</div>`;q.o.forEach((o,i)=>{h+=`<button class="option" onclick="pick(${i})" id="opt${i}">${String.fromCharCode(65+i)}) ${o}</button>`;});h+=`<div class="explanation" id="expl">💡 ${q.e}</div>`;document.getElementById("qcard").innerHTML=h;document.getElementById("nextBtn").classList.add("hidden");}
function pick(i){if(document.querySelector(".option.disabled"))return;const q=Q[ci];document.querySelectorAll(".option").forEach((b,j)=>{b.classList.add("disabled");if(j===q.a)b.classList.add("correct");if(j===i&&i!==q.a)b.classList.add("wrong");});if(i===q.a)score++;answered.push({qi:ci,sel:i,correct:i===q.a});document.getElementById("expl").style.display="block";document.getElementById("nextBtn").classList.remove("hidden");document.getElementById("scorecount").textContent=`Score: ${score}`;}
function nextQ(){ci++;if(ci>=Q.length){showResult();return;}render();}
function showResult(){document.getElementById("quiz-area").classList.add("hidden");const pct=Math.round((score/Q.length)*100);let cls=pct>=80?"score-good":pct>=50?"score-avg":"score-low";let grade=pct>=80?"🏆 Expert":pct>=65?"👍 Intermediate":pct>=50?"📘 Beginner":"🔄 Retry";let h=`<div class="card result-card"><h2>Test B2 Complete!</h2><div class="score-circle ${cls}">${pct}%</div><p style="font-size:1.2em">${score} / ${Q.length} correct</p><p style="color:#ccc;margin:10px 0">${grade} Level</p><table class="result-table"><tr><th>Metric</th><th>Value</th></tr><tr><td>✅ Correct</td><td>${score}</td></tr><tr><td>❌ Wrong</td><td>${Q.length-score}</td></tr><tr><td>📊 Accuracy</td><td>${pct}%</td></tr></table></div><h3 style="margin:20px 0 10px">📝 Full Review</h3>`;answered.forEach((a,i)=>{const q=Q[a.qi];h+=`<div class="review-q ${a.correct?'r-correct':'r-wrong'}"><strong>Q${i+1}.</strong> ${q.q}<br><span style="color:${a.correct?'#69f0ae':'#ff5252'}">Your answer: ${String.fromCharCode(65+a.sel)}) ${q.o[a.sel]}</span>`;if(!a.correct)h+=`<br><span style="color:#69f0ae">✅ Correct: ${String.fromCharCode(65+q.a)}) ${q.o[q.a]}</span>`;h+=`<br><small style="color:#ccc">💡 ${q.e}</small></div>`;});h+=`<div class="btn-row" style="margin:30px 0"><button class="btn btn-next" onclick="location.reload()">🔄 Retry Test</button></div>`;document.getElementById("result-area").innerHTML=h;document.getElementById("result-area").classList.remove("hidden");}
render();
</script>
</body>
</html>
