
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booster Mock 16</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;padding:10px}#top{background:#1a56db;color:#fff;padding:16px;border-radius:12px;text-align:center;margin-bottom:10px}#top h1{font-size:1.2em}#info{font-size:.95em;margin-top:6px}#nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:10px}#nav span{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#dbeafe;color:#1a56db;font-size:.72em;cursor:pointer;font-weight:700;border:2px solid transparent;position:relative}#nav span.g{background:#27ae60;color:#fff}#nav span.r{background:#e74c3c;color:#fff}#nav span.cur{border-color:#1a56db}#nav span.bk::after{content:'★';position:absolute;top:-6px;right:-4px;font-size:.55em;color:#f59e0b}.qc{background:#fff;border-radius:10px;margin-bottom:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:none}.qc.active{display:block}.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.qn{font-weight:700;color:#1e3a5f;font-size:.9em}.bm{background:none;border:2px solid #dbeafe;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:1em;color:#94a3b8}.bm.on{color:#f59e0b;border-color:#f59e0b}.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opt{padding:9px;background:#fff;border:2px solid #dbeafe;border-radius:8px;cursor:pointer;font-size:.82em;text-align:center;color:#1e3a5f;transition:.2s}.opt:hover{border-color:#1a56db;background:#eff6ff}.opt.c{background:#d4edda!important;border-color:#27ae60!important;color:#155724!important;font-weight:700}.opt.w{background:#f8d7da!important;border-color:#e74c3c!important;color:#721c24!important;font-weight:700}.opt.s{background:#d4edda!important;border-color:#27ae60!important;color:#155724!important}.opt.d{pointer-events:none;opacity:.6}.ex{background:#eff6ff;border-left:3px solid #1a56db;padding:6px 10px;margin-top:8px;font-size:.78em;color:#1e3a5f;display:none;border-radius:0 6px 6px 0}#bar{display:flex;gap:8px;justify-content:center;margin-top:10px}#bar button{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.85em}#pv{background:#dbeafe;color:#1a56db}#nx{background:#1a56db;color:#fff}#res{display:none;text-align:center;background:#fff;padding:20px;border-radius:12px;margin-top:10px}#res h2{color:#1a56db}#res p{margin:4px 0;color:#1e3a5f}.rb{margin-top:12px;padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.9em}.rb1{background:#1a56db;color:#fff}.rb2{background:#dbeafe;color:#1a56db;margin-left:8px}#bmlist{display:none;background:#fff;padding:14px;border-radius:10px;margin-top:10px}#bmlist h3{color:#f59e0b;margin-bottom:8px}.ft{text-align:center;color:#94a3b8;font-size:.72em;margin-top:12px}</style></head><body>
<div id="top"><h1>📅 Booster Mock 16 — Important Days & Dates</h1><div id="info">Score: <span id="sc">0</span>/30 | Q: <span id="qnum">1</span>/30 | 🔖 <span id="bc">0</span></div></div>

<div class="ft">IBPS/SBI/RRB Mains 2026</div>
<script>

{q:"World Environment Day?",o:["Mar 22","Apr 22","Jun 5","Sep 16"],a:2,e:"UNEP; theme changes yearly; since 1974"},
{q:"World Water Day?",o:["Mar 22","Apr 22","Jun 5","Jul 11"],a:0,e:"UN; water conservation; since 1993"},
{q:"Earth Day?",o:["Mar 22","Apr 22","Jun 5","Sep 16"],a:1,e:"Environmental protection; since 1970"},
{q:"International Yoga Day?",o:["Jun 5","Jun 21","Jul 1","Aug 15"],a:1,e:"PM Modi proposed at UN; since 2015"},
{q:"World Health Day?",o:["Mar 8","Apr 7","May 12","Jun 14"],a:1,e:"WHO founded; global health awareness"},
{q:"International Women's Day?",o:["Mar 8","May 12","Jun 14","Aug 9"],a:0,e:"Gender equality; women empowerment; UN"},

{q:"World Food Day?",o:["Sep 16","Oct 16","Nov 14","Dec 1"],a:1,e:"FAO founded 1945; food security; hunger"},

{q:"World Telecommunications Day?",o:["Mar 17","May 17","Jul 17","Sep 17"],a:1,e:"ITU founded 1865; also World Information Society Day"},
{q:"International Day of Biodiversity?",o:["Mar 22","May 22","Jul 22","Sep 22"],a:1,e:"CBD; biological diversity; ecosystems"},

{q:"World Population Day?",o:["May 11","Jun 11","Jul 11","Aug 11"],a:2,e:"UNFPA; since 1989; 5 billion milestone 1987"},
{q:"World Tourism Day?",o:["Jul 27","Aug 27","Sep 27","Oct 27"],a:2,e:"UNWTO; tourism importance; since 1980"},
{q:"International Day of Peace?",o:["Aug 21","Sep 21","Oct 21","Nov 21"],a:1,e:"UN; non-violence; ceasefire day"},
{q:"World Ozone Day?",o:["Aug 16","Sep 16","Oct 16","Nov 16"],a:1,e:"Montreal Protocol 1987; ozone layer protection"},
{q:"World Teachers Day?",o:["Sep 5","Oct 5","Nov 5","Dec 5"],a:1,e:"UNESCO; since 1994; India celebrates Sep 5 as Teachers Day"},
{q:"India Teachers Day — Sep 5 — birthday of?",o:["Mahatma Gandhi","Dr Sarvepalli Radhakrishnan","Jawaharlal Nehru","APJ Abdul Kalam"],a:1,e:"2nd President of India; philosopher"},
{q:"Children's Day — Nov 14 — birthday of?",o:["Gandhi","Radhakrishnan","Jawaharlal Nehru","Ambedkar"],a:2,e:"1st PM of India; 'Chacha Nehru'"},
{q:"Constitution Day of India?",o:["Jan 26","Aug 15","Nov 26","Dec 6"],a:2,e:"Adopted 1949; Dr Ambedkar; also Law Day"},
{q:"National Voters Day?",o:["Jan 15","Jan 25","Feb 15","Mar 25"],a:1,e:"ECI founded 1950; democratic participation"},
{q:"World Diabetes Day?",o:["Oct 14","Nov 14","Dec 14","Jan 14"],a:1,e:"Sir Frederick Banting birthday; insulin discovery"}
];
var Q,cur=0,sc=0,ans,bk;function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
function init(sh){Q=sh?shuffle(OQ):OQ.slice();cur=0;sc=0;ans=new Array(Q.length).fill(-1);bk=new Array(Q.length).fill(false);var n=document.getElementById('nav');n.innerHTML='';var a=document.getElementById('qarea');a.innerHTML='';document.getElementById('res').style.display='none';document.getElementById('bmlist').style.display='none';document.getElementById('sc').textContent='0';document.getElementById('bc').textContent='0';for(var i=0;i<Q.length;i++){var s=document.createElement('span');s.textContent=i+1;s.onclick=(function(x){return function(){cur=x;show()}})(i);n.appendChild(s);var d=document.createElement('div');d.className='qc';d.id='q'+i;var h='<div class="qh"><div class="qn">Q'+(i+1)+'. '+Q[i].q+'</div><button class="bm" onclick="togBM('+i+')" id="bm'+i+'">☆</button></div><div class="opts">';for(var j=0;j<4;j++)h+='<div class="opt" onclick="pick('+i+','+j+')">'+String.fromCharCode(65+j)+') '+Q[i].o[j]+'</div>';h+='</div><div class="ex" id="ex'+i+'">💡 '+Q[i].e+'</div>';d.innerHTML=h;a.appendChild(d)}show()}
function show(){document.querySelectorAll('.qc').forEach(function(e){e.classList.remove('active')});document.getElementById('q'+cur).classList.add('active');document.getElementById('qnum').textContent=cur+1;var ns=document.getElementById('nav').children;for(var i=0;i<ns.length;i++){ns[i].classList.remove('cur');if(i===cur)ns[i].classList.add('cur')}}
function togBM(i){bk[i]=!bk[i];var b=document.getElementById('bm'+i);b.textContent=bk[i]?'★':'☆';b.classList.toggle('on',bk[i]);document.getElementById('nav').children[i].classList.toggle('bk',bk[i]);document.getElementById('bc').textContent=bk.filter(Boolean).length}
function pick(qi,oi){if(ans[qi]>=0)return;ans[qi]=oi;var opts=document.getElementById('q'+qi).querySelectorAll('.opt');for(var j=0;j<opts.length;j++)opts[j].classList.add('d');if(oi===Q[qi].a){opts[oi].classList.add('c');sc++;document.getElementById('nav').children[qi].classList.add('g')}else{opts[oi].classList.add('w');opts[Q[qi].a].classList.add('s');document.getElementById('nav').children[qi].classList.add('r')}document.getElementById('ex'+qi).style.display='block';document.getElementById('sc').textContent=sc;if(ans.every(function(x){return x>=0})){document.getElementById('res').style.display='block';document.getElementById('fs').textContent=sc;var p=Math.round(sc/Q.length*100);document.getElementById('fp').textContent=p;document.getElementById('grade').textContent=p>=80?'🌟 Expert!':p>=65?'👍 Good!':'📚 Keep Practicing!';document.getElementById('fb').textContent=bk.filter(Boolean).length}}

function showBM(){var el=document.getElementById('bmlist');var qs=document.getElementById('bmqs');qs.innerHTML='';var f=false;for(var i=0;i<Q.length;i++){if(bk[i]){f=true;qs.innerHTML+='<div style="background:#eff6ff;border-left:3px solid #1a56db;padding:8px;margin:4px 0;border-radius:0 6px 6px 0;font-size:.82em"><b>Q'+(i+1)+'.</b> '+Q[i].q+'<br><span style="color:#27ae60;font-weight:700">✅ '+String.fromCharCode(65+Q[i].a)+') '+Q[i].o[Q[i].a]+'</span><br><span style="color:#1a56db">💡 '+Q[i].e+'</span></div>'}}if(!f)qs.innerHTML='<p style="color:#94a3b8">No bookmarks</p>';el.style.display='block'}
init(false);
</script></body></html>
