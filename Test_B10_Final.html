
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test B10 – Final Round</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#c31432,#240b36);min-height:100vh;color:#fff;padding:20px}.container{max-width:750px;margin:0 auto}.header{text-align:center;padding:20px;background:rgba(0,0,0,.35);border-radius:16px;margin-bottom:20px;border:1px solid rgba(255,255,255,.15)}.header h1{font-size:1.4em;background:linear-gradient(90deg,#ff416c,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header p{color:#ccc;margin-top:5px;font-size:.9em}.progress-container{background:rgba(255,255,255,.1);border-radius:20px;height:10px;margin:20px 0;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#ff416c,#ffd200);border-radius:20px;transition:width .4s}.stats{display:flex;justify-content:space-between;font-size:.85em;color:#ddd;margin-bottom:15px}.card{background:rgba(0,0,0,.3);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,.15);margin-bottom:20px}.q-num{font-size:.8em;color:#ff416c;font-weight:700;margin-bottom:8px}.q-text{font-size:1.05em;line-height:1.5;margin-bottom:20px}.option{display:block;width:100%;padding:14px 18px;margin:8px 0;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:.95em;cursor:pointer;text-align:left;transition:all .2s}.option:hover:not(.disabled){background:rgba(255,255,255,.12)}.option.correct{background:rgba(0,200,83,.2);border-color:#00c853;color:#69f0ae}.option.wrong{background:rgba(255,23,68,.2);border-color:#ff1744;color:#ff5252}.option.disabled{cursor:default;opacity:.7}.explanation{margin-top:15px;padding:15px;background:rgba(255,215,0,.08);border-left:3px solid #ffd200;border-radius:0 8px 8px 0;font-size:.9em;color:#eee;display:none}.btn-row{display:flex;gap:10px;justify-content:center;margin-top:15px}.btn{padding:12px 30px;border:none;border-radius:10px;font-size:.95em;font-weight:600;cursor:pointer}.btn-next{background:linear-gradient(90deg,#ff416c,#ffd200);color:#000}.result-card{text-align:center;padding:40px}.score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;font-size:2em;font-weight:700}.score-good{background:rgba(0,200,83,.15);border:3px solid #00c853;color:#69f0ae}.score-avg{background:rgba(255,215,0,.15);border:3px solid #ffd200;color:#ffd200}.score-low{background:rgba(255,23,68,.15);border:3px solid #ff1744;color:#ff5252}.result-table{width:100%;margin-top:25px;border-collapse:collapse;font-size:.85em}.result-table th{padding:10px;background:rgba(255,255,255,.1);text-align:left}.result-table td{padding:8px 10px}.review-q{padding:15px;margin:10px 0;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}.review-q.r-correct{border-left:4px solid #00c853}.review-q.r-wrong{border-left:4px solid #ff1744}.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🏆 Test B10 – Final Round Mixed</h1><p>Set B • Q271–Q307 (37 MCQs) • IBPS/SBI/RRB Mains</p></div>
<div id="quiz-area">
<div class="progress-container"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<div class="stats"><span id="qcount">Q 1/37</span><span id="scorecount">Score: 0</span></div>
<div class="card" id="qcard"></div>
<div class="btn-row"><button class="btn btn-next hidden" id="nextBtn" onclick="nextQ()">Next →</button></div>
</div>
<div id="result-area" class="hidden"></div>
</div>
<script>
const Q=[
{q:"Sukanya Samriddhi Yojana is for:",o:["Senior citizens","Girl child below 10 years","Farmers","Disabled persons"],a:1,e:"SSY for girl child below 10 years."},
{q:"PM Vishwakarma Scheme loans at:",o:["3% interest","5% interest","7% interest","10% interest"],a:1,e:"PM Vishwakarma: 5% interest, collateral-free."},
{q:"Manmohan Singh was PM who also served as:",o:["President","RBI Governor","Chief Justice","SEBI Chairman"],a:1,e:"He served as both PM and RBI Governor."},
{q:"Repo Rate is a tool of:",o:["Fiscal Policy","Monetary Policy","Trade Policy","Industrial Policy"],a:1,e:"Repo Rate = monetary policy tool by RBI."},
{q:"Which institution manages liquidity in India?",o:["SEBI","Ministry of Finance","RBI","NABARD"],a:2,e:"RBI manages liquidity through monetary policy."},
{q:"NPA stands for:",o:["National Payment Authority","Non-Performing Assets","National Pension Account","Non-Performing Accounts"],a:1,e:"NPA = Non-Performing Assets."},
{q:"RTGS minimum amount is:",o:["Rs 50,000","Rs 1,00,000","Rs 2,00,000","No minimum"],a:2,e:"RTGS minimum = Rs 2,00,000."},
{q:"Vijaya & Dena Bank merged with BoB effective:",o:["1 Apr 2018","1 Apr 2019","1 Apr 2020","1 Jan 2019"],a:1,e:"Effective 1 April 2019."},
{q:"Reverse Repo Rate is used by RBI to:",o:["Lend to banks","Borrow from banks","Print currency","Regulate stocks"],a:1,e:"Reverse Repo = rate RBI borrows from banks."},
{q:"Money Market instruments include:",o:["Shares and bonds","Treasury bills, CP, CDs","Real estate","Gold and silver"],a:1,e:"T-bills, Commercial Paper, CDs are money market instruments."},
{q:"NEFT operates in:",o:["Real-time","Batch-wise (half-hourly)","Weekly batches","Monthly cycles"],a:1,e:"NEFT operates in half-hourly batches."},
{q:"A Bearer Cheque can be:",o:["Only deposited","Encashed by anyone holding it","Only online","Only by payee"],a:1,e:"Bearer cheque = encashed by anyone presenting it."},
{q:"'Phishing' in digital banking is:",o:["ATM fraud","Fraudulent emails/websites to steal info","Counterfeiting","Insider trading"],a:1,e:"Phishing = stealing credentials via fake emails/websites."},
{q:"UPI was launched in:",o:["2014","2015","2016","2017"],a:2,e:"UPI launched April 2016 by NPCI."},
{q:"RuPay is:",o:["A mobile app","India's domestic card payment network","A type of loan","A savings scheme"],a:1,e:"RuPay = domestic card network by NPCI."},
{q:"ECS stands for:",o:["Electronic Clearing System","Electronic Cash Service","Electronic Credit System","Electronic Currency Service"],a:0,e:"ECS = Electronic Clearing System."},
{q:"AEPS stands for:",o:["Aadhaar Enabled Payment System","Automatic Electronic Payment System","Aadhaar Electronic Payment Service","Automated Entry Payment System"],a:0,e:"AEPS = Aadhaar Enabled Payment System."},
{q:"NACH stands for:",o:["National Automated Clearing House","National Account Clearing Hub","National Automated Cash House","None of these"],a:0,e:"NACH = National Automated Clearing House."},
{q:"14 banks nationalized on:",o:["15 Aug 1969","19 July 1969","1 Apr 1969","26 Jan 1969"],a:1,e:"Nationalized on 19 July 1969."},
{q:"EXIM Bank focuses on:",o:["Domestic retail","Export-import financing","Agriculture","Insurance"],a:1,e:"EXIM Bank finances foreign trade."},
{q:"CASA ratio indicates:",o:["NPA level","Proportion of low-cost deposits","Capital adequacy","Profit margin"],a:1,e:"CASA = Current + Savings Account ratio."},
{q:"PPP stands for:",o:["Public Private Partnership","Public Pension Plan","Private Provident Plan","Public Payment Platform"],a:0,e:"PPP = Public Private Partnership."},
{q:"LIC stands for:",o:["Life Insurance Company","Life Insurance Corporation","Loan Insurance Corporation","Life Investment Corporation"],a:1,e:"LIC = Life Insurance Corporation."},
{q:"'The Name You Can Bank Upon' belongs to:",o:["SBI","PNB","Bank of India","Central Bank"],a:1,e:"PNB's tagline."},
{q:"Which is NOT a function of RBI?",o:["Issuing currency","Regulating banks","Lending directly to public","Managing forex"],a:2,e:"RBI does not lend directly to the public."},
{q:"IMPS was launched by:",o:["RBI","SBI","NPCI","SEBI"],a:2,e:"IMPS launched by NPCI in November 2010."},
{q:"A Demand Draft is:",o:["A type of loan","A banker's cheque/payment instrument","A savings account","An insurance policy"],a:1,e:"DD = prepaid payment instrument by bank."},
{q:"GIC stands for:",o:["General Insurance Corporation","Government Insurance Company","Global Insurance Corporation","Government Investment Corporation"],a:0,e:"GIC = General Insurance Corporation."},
{q:"'Relationship Beyond Banking' belongs to:",o:["SBI","HDFC","Central Bank of India","Bank of India"],a:2,e:"Central Bank of India's tagline."},
{q:"RBI adopted inflation targeting in:",o:["2014","2015","2016","2017"],a:2,e:"RBI adopted inflation targeting in 2016."},
{q:"GSTIN has how many characters?",o:["10","12","14","15"],a:3,e:"GSTIN = 15-character code."},
{q:"Wealth Tax was abolished in:",o:["2013","2014","2015","2016"],a:2,e:"Wealth Tax abolished in 2015."},
{q:"GSTR-3B is used for:",o:["Annual return","Monthly tax payment","Quarterly return","Audit report"],a:1,e:"GSTR-3B for monthly GST payment."},
{q:"GST 2.0 has how many slabs?",o:["3","4","5","6"],a:1,e:"4 slabs: 0%, 5%, 18%, 40%."},
{q:"R.K. Shanmukham Chetty presented first budget on:",o:["15 Aug 1947","26 Nov 1947","26 Jan 1950","1 Apr 1948"],a:1,e:"First budget on 26 November 1947."},
{q:"PF stands for:",o:["Private Fund","Provident Fund","Public Finance","Pension Fund"],a:1,e:"PF = Provident Fund."},
{q:"UIC stands for:",o:["United Insurance Company","Universal Insurance Corp","United India Insurance Company","Union Insurance Company"],a:2,e:"UIC = United India Insurance Company."}
];
let ci=0,score=0,answered=[];
function render(){const q=Q[ci];document.getElementById("pbar").style.width=((ci/Q.length)*100)+"%";document.getElementById("qcount").textContent=`Q ${ci+1}/${Q.length}`;document.getElementById("scorecount").textContent=`Score: ${score}`;let h=`<div class="q-num">Q${ci+1}/${Q.length}</div><div class="q-text">${q.q}</div>`;q.o.forEach((o,i)=>{h+=`<button class="option" onclick="pick(${i})">${String.fromCharCode(65+i)}) ${o}</button>`;});h+=`<div class="explanation" id="expl">💡 ${q.e}</div>`;document.getElementById("qcard").innerHTML=h;document.getElementById("nextBtn").classList.add("hidden");}
function pick(i){if(document.querySelector(".option.disabled"))return;const q=Q[ci];document.querySelectorAll(".option").forEach((b,j)=>{b.classList.add("disabled");if(j===q.a)b.classList.add("correct");if(j===i&&i!==q.a)b.classList.add("wrong");});if(i===q.a)score++;answered.push({qi:ci,sel:i,correct:i===q.a});document.getElementById("expl").style.display="block";document.getElementById("nextBtn").classList.remove("hidden");document.getElementById("scorecount").textContent=`Score: ${score}`;}
function nextQ(){ci++;if(ci>=Q.length){showResult();return;}render();}
function showResult(){document.getElementById("quiz-area").classList.add("hidden");const pct=Math.round((score/Q.length)*100);let cls=pct>=80?"score-good":pct>=50?"score-avg":"score-low";let grd=pct>=80?"🏆 Expert":pct>=65?"👍 Intermediate":pct>=50?"📘 Beginner":"🔄 Retry";let h=`<div class="card result-card"><h2>🏆 B10 Final Round Complete!</h2><div class="score-circle ${cls}">${pct}%</div><p style="font-size:1.2em">${score}/${Q.length}</p><p style="color:#ccc">${grd}</p><table class="result-table"><tr><th>Metric</th><th>Value</th></tr><tr><td>✅</td><td>${score}</td></tr><tr><td>❌</td><td>${Q.length-score}</td></tr><tr><td>📊</td><td>${pct}%</td></tr></table></div><h3 style="margin:20px 0 10px">📝 Review</h3>`;answered.forEach((a,i)=>{const q=Q[a.qi];h+=`<div class="review-q ${a.correct?'r-correct':'r-wrong'}"><strong>Q${i+1}.</strong> ${q.q}<br><span style="color:${a.correct?'#69f0ae':'#ff5252'}">You: ${String.fromCharCode(65+a.sel)}) ${q.o[a.sel]}</span>`;if(!a.correct)h+=`<br><span style="color:#69f0ae">✅ ${String.fromCharCode(65+q.a)}) ${q.o[q.a]}</span>`;h+=`<br><small style="color:#ccc">💡 ${q.e}</small></div>`;});h+=`<div class="btn-row" style="margin:30px 0"><button class="btn btn-next" onclick="location.reload()">🔄 Retry</button></div>`;document.getElementById("result-area").innerHTML=h;document.getElementById("result-area").classList.remove("hidden");}
render();
</script>
</body>
</html>
