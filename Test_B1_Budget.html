
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test B1 – Budget Basics & History</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:#fff;padding:20px}
.container{max-width:750px;margin:0 auto}
.header{text-align:center;padding:20px;background:rgba(255,255,255,.05);border-radius:16px;margin-bottom:20px;border:1px solid rgba(255,255,255,.1)}
.header h1{font-size:1.5em;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:#aaa;margin-top:5px;font-size:.9em}
.progress-container{background:rgba(255,255,255,.1);border-radius:20px;height:10px;margin:20px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#f7971e,#ffd200);border-radius:20px;transition:width .4s}
.stats{display:flex;justify-content:space-between;font-size:.85em;color:#ccc;margin-bottom:15px}
.card{background:rgba(255,255,255,.07);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.q-num{font-size:.8em;color:#f7971e;font-weight:700;margin-bottom:8px}
.q-text{font-size:1.05em;line-height:1.5;margin-bottom:20px}
.option{display:block;width:100%;padding:14px 18px;margin:8px 0;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:.95em;cursor:pointer;text-align:left;transition:all .2s}
.option:hover:not(.disabled){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.option.correct{background:rgba(0,200,83,.15);border-color:#00c853;color:#69f0ae}
.option.wrong{background:rgba(255,23,68,.15);border-color:#ff1744;color:#ff5252}
.option.disabled{cursor:default;opacity:.7}
.option.show-correct{border-color:#00c853;background:rgba(0,200,83,.08)}
.explanation{margin-top:15px;padding:15px;background:rgba(255,215,0,.08);border-left:3px solid #ffd200;border-radius:0 8px 8px 0;font-size:.9em;color:#ddd;display:none}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:15px}
.btn{padding:12px 30px;border:none;border-radius:10px;font-size:.95em;font-weight:600;cursor:pointer;transition:all .2s}
.btn-next{background:linear-gradient(90deg,#f7971e,#ffd200);color:#000}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(247,151,30,.4)}
.result-card{text-align:center;padding:40px}
.score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;font-size:2em;font-weight:700}
.score-good{background:rgba(0,200,83,.15);border:3px solid #00c853;color:#69f0ae}
.score-avg{background:rgba(255,215,0,.15);border:3px solid #ffd200;color:#ffd200}
.score-low{background:rgba(255,23,68,.15);border:3px solid #ff1744;color:#ff5252}
.result-table{width:100%;margin-top:25px;border-collapse:collapse;font-size:.85em}
.result-table th{padding:10px;background:rgba(255,255,255,.1);border-radius:6px;text-align:left}
.result-table td{padding:8px 10px}
.review-q{padding:15px;margin:10px 0;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.review-q.r-correct{border-left:4px solid #00c853}
.review-q.r-wrong{border-left:4px solid #ff1744}
.hidden{display:none}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:600}
.tag-budget{background:rgba(247,151,30,.2);color:#ffd200}
.badge{font-size:.75em;padding:2px 8px;border-radius:10px;margin-left:8px}
.badge-corr{background:rgba(255,23,68,.2);color:#ff5252}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📋 Test B1 – Budget Basics & History</h1>
<p>Set B (Re-Split) • Q1–Q30 of 307 • IBPS/SBI/RRB Mains 2026</p>
<p><span class="tag tag-budget">BUDGET</span></p>
</div>
<div id="quiz-area">
<div class="progress-container"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<div class="stats"><span id="qcount">Question 1 / 30</span><span id="scorecount">Score: 0</span></div>
<div class="card" id="qcard"></div>
<div class="btn-row"><button class="btn btn-next hidden" id="nextBtn" onclick="nextQ()">Next →</button></div>
</div>
<div id="result-area" class="hidden"></div>
</div>
<script>
const Q=[
{q:"In the Indian Constitution, the Budget is referred to as:",o:["Annual Expenditure Statement","Annual Revenue Statement","Annual Budget Statement","Annual Financial Statement"],a:3,e:"Article 112 refers to the Budget as the 'Annual Financial Statement'."},
{q:"Which Article of the Indian Constitution deals with the Annual Financial Statement (Budget)?",o:["Article 109","Article 110","Article 111","Article 112"],a:3,e:"Article 112 specifically deals with the Annual Financial Statement."},
{q:"Who defined Budget as 'A statement of the estimated receipts and expenses during a fixed period'? <span class='badge badge-corr'>⚠️ CORRECTED</span>",o:["Adam Smith","Leroy Beaulieu","Robert Walpole","Willoughby"],a:1,e:"⚠️ CORRECTED: Leroy Beaulieu defined Budget as such (not Willoughby)."},
{q:"The word 'Budget' is derived from which language?",o:["Latin","Greek","Hindi","French"],a:3,e:"Budget is derived from the French word 'Bougette'."},
{q:"Budget is a French word 'Bougette' which means:",o:["A leather bag or a wallet","A suitcase","A document to be placed before government","All of the above"],a:0,e:"'Bougette' means 'a leather bag or a wallet' in French."},
{q:"The genesis of the budget system in India can be traced to:",o:["1857","1919","1947","1860"],a:3,e:"The budget system was formally introduced in India in 1860."},
{q:"The system of budgeting in India was introduced during the tenure of:",o:["Lord Willingdon","Lord Mountbatten","Lord Ripon","Lord Canning"],a:3,e:"Lord Canning introduced the budget system in India in 1860."},
{q:"Who presents the Union Budget in Parliament?",o:["Foreign Minister","Commerce Minister","Home Minister","Finance Minister"],a:3,e:"The Finance Minister presents the Union Budget in Parliament."},
{q:"Who is the first full-time woman Finance Minister of India?",o:["Indira Gandhi","Sushma Swaraj","Nirmala Sitharaman","Sonia Gandhi"],a:2,e:"Nirmala Sitharaman is India's first full-time woman Finance Minister."},
{q:"Who holds the record of presenting the maximum number of budgets (10 times)?",o:["P. Chidambaram","Pranab Mukherjee","Morarji Desai","Yashwant Sinha"],a:2,e:"Morarji Desai presented 10 budgets (including 2 interim)."},
{q:"Which Ministry prepares the Union Budget of India?",o:["Ministry of Finance","Ministry of Home Affairs","Ministry of Education","Ministry of Defence"],a:0,e:"The Ministry of Finance prepares the Union Budget."},
{q:"The Union Budget is prepared by which department of the Finance Ministry?",o:["Department of Economic Affairs","Department of Revenue","Department of Financial Services","Department of Expenditure"],a:0,e:"The Department of Economic Affairs prepares the Union Budget."},
{q:"Who is the creator of Zero-Based Budgeting (ZBB)?",o:["Wildavsky","Peter A. Phyrr","Leroy Beaulieu","Walpole"],a:1,e:"Zero-Based Budgeting was created by Peter A. Phyrr."},
{q:"Zero-Based Budgeting (ZBB) was first introduced in which country?",o:["India","Germany","The US","The UK"],a:2,e:"ZBB was first introduced in the United States."},
{q:"In which year was Zero-Based Budgeting first experimented in India?",o:["1984","1985","1987","1989"],a:2,e:"ZBB was first experimented in India in 1987."},
{q:"Which state presented the first paperless state budget (Feb 2021)? <span class='badge badge-corr'>⚠️ CORRECTED</span>",o:["Madhya Pradesh","Uttar Pradesh","Odisha","Jharkhand"],a:1,e:"⚠️ CORRECTED: Uttar Pradesh presented the first paperless state budget (not Odisha)."},
{q:"Which of the following is India's first Paperless Union Budget?",o:["Union Budget 2021-22","Union Budget 2019-20","Union Budget 2020-21","Union Budget 2018-19"],a:2,e:"Union Budget 2020-21 was India's first paperless budget."},
{q:"The first-ever digital Union Budget of India was presented in:",o:["2020","2019","2021","2022"],a:2,e:"The first digital Union Budget was presented in 2021."},
{q:"Who presented the first Union Budget of Independent India?",o:["N.K. Chanda","Maulana Azad","C.D. Deshmukh","R.K. Shanmukham Chetty"],a:3,e:"R.K. Shanmukham Chetty presented it on 26 November 1947."},
{q:"Nirmala Sitharaman's budget presented on July 23, 2024 was her:",o:["7th budget","6th budget","5th budget","8th budget"],a:0,e:"The July 2024 budget was her 7th consecutive presentation."},
{q:"In which year did the first Gender Budget Statement appear in the Union Budget?",o:["2010-11","2001-02","2007-08","2005-06"],a:3,e:"The first Gender Budget Statement appeared in 2005-06."},
{q:"An annual statement of estimated receipts and expenditure of the government is known as:",o:["Income sheet","Plan","Account","Budget"],a:3,e:"A Budget is an annual statement of estimated receipts and expenditure."},
{q:"According to Union Budget 2025-26, the estimated fiscal deficit is: <span class='badge badge-corr'>⚠️ CORRECTED</span>",o:["3.6% of GDP","4.4% of GDP","5.9% of GDP","7.1% of GDP"],a:1,e:"⚠️ CORRECTED: The fiscal deficit for 2025-26 is estimated at 4.4% of GDP (not 3.6%)."},
{q:"A tax system that collects a greater share from higher incomes is called:",o:["Proportional tax","Regressive tax","Payroll tax","Progressive tax"],a:3,e:"Progressive tax collects a greater percentage from higher incomes."},
{q:"Fiscal Policy is also known as:",o:["Monetary Policy","Labour Market Policies","Trade Policy","Budgetary Policy"],a:3,e:"Fiscal Policy is also known as Budgetary Policy."},
{q:"When expenditure exceeds revenue, the budget is said to be in:",o:["Deficit","Surplus","Reserve","Debt"],a:0,e:"When expenditure exceeds revenue, it is called a Deficit Budget."},
{q:"Generally, the budget is divided into:",o:["Balance budget and deficit budget","Revenue budget and capital budget","Revenue receipts and revenue expenditure","Capital receipts and capital expenditure"],a:1,e:"The Union Budget is divided into Revenue Budget and Capital Budget."},
{q:"Which of these increases liabilities in the government budget?",o:["Direct taxes","Borrowings","Loan recovery","Dividends from PSUs"],a:1,e:"Borrowings increase the liabilities side of the government budget."},
{q:"Which policy creates a surplus or deficit budget for the Government?",o:["Monetary Policy","Fiscal Policy","Industrial Policy 1948","Industrial Policy 1980"],a:1,e:"Fiscal Policy creates surplus or deficit budgets."},
{q:"Which of these budgets suits developing economies including India?",o:["Deficit budget","Surplus budget","Balanced budget","None of these"],a:0,e:"A Deficit Budget suits developing economies like India."}
];
let ci=0,score=0,answered=[];
function render(){
const q=Q[ci];
document.getElementById("pbar").style.width=((ci/Q.length)*100)+"%";
document.getElementById("qcount").textContent=`Question ${ci+1} / ${Q.length}`;
document.getElementById("scorecount").textContent=`Score: ${score}`;
let h=`<div class="q-num">Q${ci+1} of ${Q.length}</div><div class="q-text">${q.q}</div>`;
q.o.forEach((o,i)=>{h+=`<button class="option" onclick="pick(${i})" id="opt${i}">${String.fromCharCode(65+i)}) ${o}</button>`;});
h+=`<div class="explanation" id="expl">💡 ${q.e}</div>`;
document.getElementById("qcard").innerHTML=h;
document.getElementById("nextBtn").classList.add("hidden");
}
function pick(i){
if(document.querySelector(".option.disabled"))return;
const q=Q[ci];
document.querySelectorAll(".option").forEach((b,j)=>{
b.classList.add("disabled");
if(j===q.a)b.classList.add("correct");
if(j===i&&i!==q.a)b.classList.add("wrong");
});
if(i===q.a)score++;
answered.push({qi:ci,sel:i,correct:i===q.a});
document.getElementById("expl").style.display="block";
document.getElementById("nextBtn").classList.remove("hidden");
document.getElementById("scorecount").textContent=`Score: ${score}`;
}
function nextQ(){
ci++;
if(ci>=Q.length){showResult();return;}
render();
}
function showResult(){
document.getElementById("quiz-area").classList.add("hidden");
const pct=Math.round((score/Q.length)*100);
let cls=pct>=80?"score-good":pct>=50?"score-avg":"score-low";
let grade=pct>=80?"🏆 Expert":pct>=65?"👍 Intermediate":pct>=50?"📘 Beginner":"🔄 Retry";
let h=`<div class="card result-card"><h2>Test B1 Complete!</h2>
<div class="score-circle ${cls}">${pct}%</div>
<p style="font-size:1.2em">${score} / ${Q.length} correct</p>
<p style="color:#aaa;margin:10px 0">${grade} Level</p>
<table class="result-table"><tr><th>Metric</th><th>Value</th></tr>
<tr><td>✅ Correct</td><td>${score}</td></tr>
<tr><td>❌ Wrong</td><td>${Q.length-score}</td></tr>
<tr><td>📊 Accuracy</td><td>${pct}%</td></tr></table></div>
<h3 style="margin:20px 0 10px">📝 Full Review</h3>`;
answered.forEach((a,i)=>{
const q=Q[a.qi];
h+=`<div class="review-q ${a.correct?'r-correct':'r-wrong'}">
<strong>Q${i+1}.</strong> ${q.q}<br>
<span style="color:${a.correct?'#69f0ae':'#ff5252'}">Your answer: ${String.fromCharCode(65+a.sel)}) ${q.o[a.sel]}</span>`;
if(!a.correct)h+=`<br><span style="color:#69f0ae">✅ Correct: ${String.fromCharCode(65+q.a)}) ${q.o[q.a]}</span>`;
h+=`<br><small style="color:#aaa">💡 ${q.e}</small></div>`;
});
h+=`<div class="btn-row" style="margin:30px 0"><button class="btn btn-next" onclick="location.reload()">🔄 Retry Test</button></div>`;
document.getElementById("result-area").innerHTML=h;
document.getElementById("result-area").classList.remove("hidden");
}
render();
</script>
</body>
</html>
