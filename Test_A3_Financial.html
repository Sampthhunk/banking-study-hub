<script>
var qs=[
{q:"How many AIFIs are recognized by RBI?",o:["3","4","5","6"],a:2,e:"5 AIFIs: NABARD, SIDBI, EXIM Bank, NHB, NaBFID."},
{q:"NABARD was established on:",o:["2 April 1990","12 July 1982","1 January 1982","9 July 1988"],a:1,e:"NABARD was established on 12 July 1982."},
{q:"Where is SIDBI headquartered?",o:["Mumbai","New Delhi","Lucknow","Chennai"],a:2,e:"SIDBI is headquartered in Lucknow."},
{q:"SEBI became a statutory body in:",o:["1988","1990","1992","1995"],a:2,e:"SEBI became statutory body on 12 April 1992."},
{q:"IRDAI is headquartered in:",o:["Mumbai","New Delhi","Hyderabad","Chennai"],a:2,e:"IRDAI is headquartered in Hyderabad."},
{q:"NPCI operates which payment systems?",o:["RTGS","NEFT","UPI, RuPay, NACH, IMPS","All of the above"],a:2,e:"NPCI operates UPI, RuPay, NACH, IMPS, BBPS, AEPS, BHIM."},
{q:"DICGC insures bank deposits up to:",o:["Rs 1 lakh","Rs 2 lakh","Rs 5 lakh","Rs 10 lakh"],a:2,e:"DICGC insures deposits up to Rs 5 lakh per depositor per bank."},
{q:"NaBFID was established in:",o:["2019","2020","2021","2022"],a:2,e:"NaBFID was established in 2021 for infrastructure financing."},
{q:"NABARD was set up on recommendation of:",o:["Narasimham Committee","B. Sivaraman Committee","Kelkar Committee","Urjit Patel Committee"],a:1,e:"B. Sivaraman Committee recommended the establishment of NABARD."},
{q:"NHB is a wholly-owned subsidiary of:",o:["SBI","NABARD","Government of India","RBI"],a:3,e:"NHB is a wholly-owned subsidiary of RBI."},
{q:"Who is the current SEBI Chairman?",o:["Ajay Tyagi","Madhabi Puri Buch","Tuhin Kanta Pandey","U.K. Sinha"],a:2,e:"Tuhin Kanta Pandey is the current SEBI Chairman."},
{q:"EXIM Bank was established in:",o:["1 January 1982","12 July 1982","2 April 1990","9 July 1988"],a:0,e:"EXIM Bank was established on 1 January 1982."},
{q:"IBBI was established on:",o:["2000","2013","1 October 2016","2021"],a:2,e:"IBBI established 1 October 2016."},
{q:"PFRDA regulates:",o:["Insurance sector","Banking sector","Pension funds (NPS)","Stock markets"],a:2,e:"PFRDA regulates pension funds including the National Pension System."},
{q:"CIBIL provides:",o:["Insurance coverage","Credit information/scores","Banking licenses","Deposit insurance"],a:1,e:"CIBIL = Credit Information Bureau providing credit scores."},
{q:"NEFT stands for:",o:["National Electronic Fund Transfer","National Electronic Funds Transfer","National Easy Fund Transfer","National Electronic Finance Transfer"],a:1,e:"NEFT = National Electronic Funds Transfer."},
{q:"What is the minimum amount for RTGS?",o:["Rs 50000","Rs 1 lakh","Rs 2 lakh","No minimum"],a:2,e:"RTGS minimum amount is Rs 2 lakh."},
{q:"NPA is a loan overdue for:",o:["30 days","60 days","90 days","180 days"],a:2,e:"NPA = loan where interest/principal overdue for 90+ days."},
{q:"IFSC code has how many characters?",o:["9","10","11","12"],a:2,e:"IFSC = 11-character alphanumeric code for each bank branch."},
{q:"MICR code on cheques has how many digits?",o:["6","9","11","13"],a:1,e:"MICR = 9-digit code on cheques."},
{q:"CBS stands for:",o:["Central Banking System","Core Banking Solution","Computer Banking System","Central Branch System"],a:1,e:"CBS = Core Banking Solution."},
{q:"SWIFT is used for:",o:["Domestic fund transfer","International wire transfers","Mobile payments","ATM transactions"],a:1,e:"SWIFT = Society for Worldwide Interbank Financial Telecommunication."},
{q:"KYC stands for:",o:["Know Your Customer","Keep Your Cash","Know Your Credit","Key Your Code"],a:0,e:"KYC = Know Your Customer — mandatory identity verification."},
{q:"CASA ratio indicates:",o:["NPA level","Low-cost deposits ratio","Priority sector lending","Capital adequacy"],a:1,e:"CASA = Current Account Savings Account ratio."},
{q:"BHIM app is named after:",o:["Bhimrao Ambedkar","Bhim Singh","Bhimsen Joshi","None of these"],a:0,e:"BHIM = Bharat Interface for Money, named after B.R. Ambedkar."},

{q:"BBPS stands for:",o:["Bharat Bill Payment System","Banking Bill Payment Service","Bharat Bank Payment System","Basic Bill Payment System"],a:0,e:"BBPS = Bharat Bill Payment System operated by NPCI."},

var ans={},bk={},tot=qs.length,cor=0;

function chk(i,j){if(ans[i]!==undefined)return;ans[i]=j;var ok=j===qs[i].a;if(ok)cor++;document.getElementById('o'+i+'_'+j).classList.add(ok?'c':'w');if(!ok)document.getElementById('o'+i+'_'+qs[i].a).classList.add('sh');document.getElementById('ex'+i).style.display='block';document.querySelectorAll('#q'+i+' .ob').forEach(function(b){b.style.pointerEvents='none';});document.getElementById('score').textContent=cor+'/'+tot;document.getElementById('pct').textContent=Math.round(cor/tot*100)+'%';localStorage.setItem('test_A3_last',JSON.stringify({s:cor,t:tot,d:new Date().toLocaleDateString()}));}
function tBk(i){bk[i]=!bk[i];document.querySelector('#q'+i+' .bm').classList.toggle('a');localStorage.setItem('bk_A3',JSON.stringify(bk));}
function shuffle(){qs=qs.slice().sort(function(){return Math.random()-0.5;});ans={};cor=0;document.getElementById('score').textContent='0/'+tot;document.getElementById('pct').textContent='0%';render(qs);}
function showBk(){var b=qs.filter(function(q){return bk[qs.indexOf(q)];});if(!b.length){alert('No bookmarks yet!');return;}render(b);}
var sv=localStorage.getItem('bk_A3');if(sv)bk=JSON.parse(sv);render(qs);
