
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Static Booster Mock 8</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;padding:10px}#top{background:#1a56db;color:#fff;padding:16px;border-radius:12px;text-align:center;margin-bottom:10px}#top h1{font-size:1.2em}#info{font-size:.95em;margin-top:6px}#nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:10px}#nav span{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#dbeafe;color:#1a56db;font-size:.72em;cursor:pointer;font-weight:700;border:2px solid transparent;position:relative}#nav span.g{background:#27ae60;color:#fff}#nav span.r{background:#e74c3c;color:#fff}#nav span.cur{border-color:#1a56db}#nav span.bk::after{content:'★';position:absolute;top:-6px;right:-4px;font-size:.55em;color:#f59e0b}.qc{background:#fff;border-radius:10px;margin-bottom:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:none}.qc.active{display:block}.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.qn{font-weight:700;color:#1e3a5f;font-size:.9em}.bm{background:none;border:2px solid #dbeafe;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:1em;color:#94a3b8}.bm.on{color:#f59e0b;border-color:#f59e0b}.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opt{padding:9px;background:#fff;border:2px solid #dbeafe;border-radius:8px;cursor:pointer;font-size:.82em;text-align:center;color:#1e3a5f;transition:.2s}.opt:hover{border-color:#1a56db;background:#eff6ff}.opt.c{background:#d4edda!important;border-color:#27ae60!important;color:#155724!important;font-weight:700}.opt.w{background:#f8d7da!important;border-color:#e74c3c!important;color:#721c24!important;font-weight:700}.opt.s{background:#d4edda!important;border-color:#27ae60!important;color:#155724!important}.opt.d{pointer-events:none;opacity:.6}.ex{background:#eff6ff;border-left:3px solid #1a56db;padding:6px 10px;margin-top:8px;font-size:.78em;color:#1e3a5f;display:none;border-radius:0 6px 6px 0}#bar{display:flex;gap:8px;justify-content:center;margin-top:10px}#bar button{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.85em}#pv{background:#dbeafe;color:#1a56db}#nx{background:#1a56db;color:#fff}#res{display:none;text-align:center;background:#fff;padding:20px;border-radius:12px;margin-top:10px}#res h2{color:#1a56db}#res p{margin:4px 0;color:#1e3a5f}.rb{margin-top:12px;padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.9em}.rb1{background:#1a56db;color:#fff}.rb2{background:#dbeafe;color:#1a56db;margin-left:8px}#bmlist{display:none;background:#fff;padding:14px;border-radius:10px;margin-top:10px}#bmlist h3{color:#f59e0b;margin-bottom:8px}.ft{text-align:center;color:#94a3b8;font-size:.72em;margin-top:12px}</style></head><body>
<div id="top"><h1>🌍 Static Booster Mock 8 — Intl Orgs & Summits</h1><div id="info">Score: <span id="sc">0</span>/30 | Q: <span id="qnum">1</span>/30 | 🔖 <span id="bc">0</span></div></div>
<div id="nav"></div><div id="qarea"></div>
<div id="bar"><button id="pv" onclick="go(-1)">◀ Prev</button><button id="nx" onclick="go(1)">Next ▶</button></div>
<div id="res"><h2>🏆 Complete!</h2><p>Score: <span id="fs">0</span>/30 (<span id="fp">0</span>%)</p><p id="grade"></p><p>🔖 <span id="fb">0</span></p><button class="rb rb1" onclick="retake(false)">🔄 Retake</button><button class="rb rb2" onclick="retake(true)">🔀 Shuffle</button><br><button class="rb rb2" onclick="showBM()" style="margin-top:8px">🔖 Review</button></div>
<div id="bmlist"><h3>🔖 Bookmarked</h3><div id="bmqs"></div></div>
<div class="ft">IBPS/SBI/RRB Mains 2026</div>
<script>
var OQ=[
{q:"IMF HQ?",o:["New York","Geneva","Washington D.C.","London"],a:2,e:"International Monetary Fund; est 1945"},
{q:"World Bank HQ?",o:["Geneva","Paris","Washington D.C.","Tokyo"],a:2,e:"IBRD; development financing; USA"},
{q:"UN HQ?",o:["Geneva","Washington","New York","London"],a:2,e:"United Nations; est 1945; 193 members"},
{q:"WTO HQ?",o:["New York","Geneva, Switzerland","Brussels","Vienna"],a:1,e:"World Trade Organisation; est 1995; replaced GATT"},
{q:"WHO HQ?",o:["New York","Geneva, Switzerland","Paris","Rome"],a:1,e:"World Health Organisation; est 1948"},
{q:"UNESCO HQ?",o:["Geneva","New York","Paris, France","Rome"],a:2,e:"Education, Science, Culture; est 1945"},
{q:"BRICS NDB HQ?",o:["Beijing","Moscow","Shanghai, China","New Delhi"],a:2,e:"New Development Bank; est 2015; KV Kamath 1st president"},
{q:"BRICS new members (2024)?",o:["3 countries","5 countries","6 countries","8 countries"],a:1,e:"Egypt, Ethiopia, Iran, UAE, Saudi Arabia joined"},
{q:"AIIB HQ?",o:["Shanghai","Beijing, China","Tokyo","Singapore"],a:1,e:"Asian Infrastructure Investment Bank; China-led"},
{q:"ADB HQ?",o:["Tokyo","Beijing","Manila, Philippines","Jakarta"],a:2,e:"Asian Development Bank; est 1966"},
{q:"G20 2023 host?",o:["Indonesia","India","Brazil","South Africa"],a:1,e:"New Delhi; PM Modi; 'One Earth One Family'"},
{q:"G20 2024 host?",o:["India","Brazil","South Africa","Japan"],a:1,e:"Rio de Janeiro; Lula presidency"},
{q:"G7 members count?",o:["5","7","8","10"],a:1,e:"USA, UK, France, Germany, Italy, Japan, Canada + EU"},
{q:"SAARC HQ?",o:["Delhi","Colombo","Kathmandu, Nepal","Dhaka"],a:2,e:"South Asian Assn; 8 members; est 1985"},
{q:"ASEAN members count?",o:["8","10","12","15"],a:1,e:"Association of Southeast Asian Nations; Jakarta HQ"},
{q:"OPEC HQ?",o:["Riyadh","Dubai","Vienna, Austria","Abu Dhabi"],a:2,e:"Oil Petroleum Exporting Countries; est 1960"},
{q:"NATO HQ?",o:["Washington","London","Brussels, Belgium","Paris"],a:2,e:"North Atlantic Treaty Org; est 1949; 32 members"},
{q:"SCO HQ?",o:["Beijing","Moscow","Astana, Kazakhstan","Delhi"],a:0,e:"Shanghai Cooperation Organisation; China initiative"},
{q:"COP stands for?",o:["Conference of Parties","Council of Presidents","Committee of Planning","Congress of Parliament"],a:0,e:"Climate change; UNFCCC; annual meeting"},
{q:"COP28 (2023) host?",o:["Egypt","UAE (Dubai)","Azerbaijan","Brazil"],a:1,e:"Loss & damage fund; fossil fuel transition"},
{q:"Human Development Index published by?",o:["World Bank","IMF","UNDP","WHO"],a:2,e:"UN Development Programme; health, edu, income"},
{q:"Global Hunger Index published by?",o:["FAO","Concern Worldwide + Welthungerhilfe","UNDP","WFP"],a:1,e:"Annual; 4 indicators; 0-100 scale"},
{q:"Ease of Doing Business — published by?",o:["IMF","World Bank","WEF","UNCTAD"],a:1,e:"Discontinued 2021; replaced by B-READY"},
{q:"Global Innovation Index published by?",o:["UNESCO","WIPO","WEF","UNDP"],a:1,e:"World Intellectual Property Org; Geneva"},
{q:"Corruption Perceptions Index by?",o:["World Bank","UN","Transparency International","OECD"],a:2,e:"Berlin; 0-100 scale; Denmark usually tops"},
{q:"FIFA HQ?",o:["Paris","Zurich, Switzerland","London","New York"],a:1,e:"Federation Intl de Football Assn; est 1904"},
{q:"ICC HQ?",o:["London","Mumbai","Dubai, UAE","Melbourne"],a:2,e:"International Cricket Council"},
{q:"IOC HQ?",o:["Paris","Zurich","Lausanne, Switzerland","London"],a:2,e:"International Olympic Committee; est 1894"},
{q:"Interpol HQ?",o:["Paris","Lyon, France","Geneva","Brussels"],a:1,e:"International Criminal Police Org; 195 members"},
{q:"Red Cross HQ?",o:["New York","Paris","Geneva, Switzerland","London"],a:2,e:"ICRC; est 1863; Henry Dunant; Nobel Peace Prize"}
];
var Q,cur=0,sc=0,ans,bk;function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
function init(sh){Q=sh?shuffle(OQ):OQ.slice();cur=0;sc=0;ans=new Array(Q.length).fill(-1);bk=new Array(Q.length).fill(false);var n=document.getElementById('nav');n.innerHTML='';var a=document.getElementById('qarea');a.innerHTML='';document.getElementById('res').style.display='none';document.getElementById('bmlist').style.display='none';document.getElementById('sc').textContent='0';document.getElementById('bc').textContent='0';for(var i=0;i<Q.length;i++){var s=document.createElement('span');s.textContent=i+1;s.onclick=(function(x){return function(){cur=x;show()}})(i);n.appendChild(s);var d=document.createElement('div');d.className='qc';d.id='q'+i;var h='<div class="qh"><div class="qn">Q'+(i+1)+'. '+Q[i].q+'</div><button class="bm" onclick="togBM('+i+')" id="bm'+i+'">☆</button></div><div class="opts">';for(var j=0;j<4;j++)h+='<div class="opt" onclick="pick('+i+','+j+')">'+String.fromCharCode(65+j)+') '+Q[i].o[j]+'</div>';h+='</div><div class="ex" id="ex'+i+'">💡 '+Q[i].e+'</div>';d.innerHTML=h;a.appendChild(d)}show()}
function show(){document.querySelectorAll('.qc').forEach(function(e){e.classList.remove('active')});document.getElementById('q'+cur).classList.add('active');document.getElementById('qnum').textContent=cur+1;var ns=document.getElementById('nav').children;for(var i=0;i<ns.length;i++){ns[i].classList.remove('cur');if(i===cur)ns[i].classList.add('cur')}}
function togBM(i){bk[i]=!bk[i];var b=document.getElementById('bm'+i);b.textContent=bk[i]?'★':'☆';b.classList.toggle('on',bk[i]);document.getElementById('nav').children[i].classList.toggle('bk',bk[i]);document.getElementById('bc').textContent=bk.filter(Boolean).length}
function pick(qi,oi){if(ans[qi]>=0)return;ans[qi]=oi;var opts=document.getElementById('q'+qi).querySelectorAll('.opt');for(var j=0;j<opts.length;j++)opts[j].classList.add('d');if(oi===Q[qi].a){opts[oi].classList.add('c');sc++;document.getElementById('nav').children[qi].classList.add('g')}else{opts[oi].classList.add('w');opts[Q[qi].a].classList.add('s');document.getElementById('nav').children[qi].classList.add('r')}document.getElementById('ex'+qi).style.display='block';document.getElementById('sc').textContent=sc;if(ans.every(function(x){return x>=0})){document.getElementById('res').style.display='block';document.getElementById('fs').textContent=sc;var p=Math.round(sc/Q.length*100);document.getElementById('fp').textContent=p;document.getElementById('grade').textContent=p>=80?'🌟 Expert!':p>=65?'👍 Good!':'📚 Keep Practicing!';document.getElementById('fb').textContent=bk.filter(Boolean).length}}
function go(d){cur+=d;if(cur<0)cur=0;if(cur>=Q.length)cur=Q.length-1;show()}
function retake(sh){init(sh)}
function showBM(){var el=document.getElementById('bmlist');var qs=document.getElementById('bmqs');qs.innerHTML='';var f=false;for(var i=0;i<Q.length;i++){if(bk[i]){f=true;qs.innerHTML+='<div style="background:#eff6ff;border-left:3px solid #1a56db;padding:8px;margin:4px 0;border-radius:0 6px 6px 0;font-size:.82em"><b>Q'+(i+1)+'.</b> '+Q[i].q+'<br><span style="color:#27ae60;font-weight:700">✅ '+String.fromCharCode(65+Q[i].a)+') '+Q[i].o[Q[i].a]+'</span><br><span style="color:#1a56db">💡 '+Q[i].e+'</span></div>'}}if(!f)qs.innerHTML='<p style="color:#94a3b8">No bookmarks</p>';el.style.display='block'}
init(false);
</script></body></html>
