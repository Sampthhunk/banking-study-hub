*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a1628;color:#e0e0e0;min-height:100vh}.hd{background:linear-gradient(135deg,#1a237e,#0d47a1);padding:15px;text-align:center;border-bottom:3px solid #ffd740}.hd h1{color:#fff;font-size:1.3em}.hd p{color:#ffd740;font-size:0.85em;margin-top:4px}.bx{max-width:750px;margin:10px auto;padding:0 10px}.sc{background:#1a2744;border-radius:10px;padding:12px;margin:8px 0;text-align:center}.sc .bg{font-size:2em;color:#ffd740;font-weight:bold}.qc{background:#1a2744;border-radius:10px;padding:15px;margin:10px 0;border-left:4px solid #ef5350}.qn{color:#ffd740;font-size:0.8em;margin-bottom:5px}.qt{color:#e0e0e0;font-size:0.95em;margin-bottom:10px;line-height:1.4}.ob{display:block;width:100%;padding:10px;margin:4px 0;background:#0d1b2a;border:1px solid #263238;border-radius:8px;color:#b0bec5;cursor:pointer;text-align:left;font-size:0.88em;transition:0.2s}.ob:hover{background:#1e3a5f;border-color:#42a5f5}.ob.c{background:#1b5e20;border-color:#4caf50;color:#fff}.ob.w{background:#b71c1c;border-color:#f44336;color:#fff}.ob.sh{background:#1b5e20;border-color:#4caf50;color:#fff}.ex{display:none;background:#0d2137;padding:10px;border-radius:6px;margin-top:8px;font-size:0.82em;color:#90caf9;border-left:3px solid #ffd740}.bm{float:right;background:none;border:none;color:#546e7a;cursor:pointer;font-size:1.1em}.bm.a{color:#ffd740}.tb{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}.hl{display:inline-block;padding:8px 18px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:0.85em;cursor:pointer;border:none;transition:0.3s}.h1{background:#ffd740;color:#1a237e}.h2{background:#42a5f5;color:#fff}.h3{background:#ff7043;color:#fff}.ft{text-align:center;padding:12px;color:#546e7a;font-size:0.7em;margin-top:15px;border-top:1px solid #1a2744}

<body>
<div class="hd"><h1>📘 Test A6 — Accounts, Intl Orgs & Important Days</h1><p>Static Banking Awareness | 20 MCQs | Set A</p></div>
<div class="bx">
<div class="sc"><div class="bg" id="score">0/20</div><p>Score | <span id="pct">0%</span></p></div>
<div class="tb"><button class="hl h2" onclick="shuffle()">🔀 Shuffle</button><button class="hl h3" onclick="showBk()">🔖 Bookmarked</button><a href="index.html" class="hl h1">🏠 Dashboard</a></div>
<div id="qA"></div>
</div>
<div class="ft">Banking Study Hub | Sampath Kumar | Set A: Test 6 of 6</div>
<script>
var qs=[
{q:"Fixed Deposit is insured by DICGC up to:",o:["Rs 1 lakh","Rs 2 lakh","Rs 5 lakh","Rs 10 lakh"],a:2,e:"DICGC insures deposits up to Rs 5 lakh per depositor per bank."},
{q:"FCNR Account is maintained in:",o:["Indian Rupees","Foreign currency","Gold","Both INR and foreign"],a:1,e:"FCNR Account maintained in foreign currency, fully repatriable."},
{q:"Salary Account auto-converts to savings if salary stops for:",o:["1 month","2 months","3 months","6 months"],a:2,e:"Auto-converts to savings if salary stops for 3 months."},
{q:"Under SARFAESI, banks can seize assets without court for loans above:",o:["Rs 50000","Rs 1 lakh","Rs 5 lakh","Rs 10 lakh"],a:1,e:"SARFAESI allows seizure without court for loans above Rs 1 lakh."},
{q:"FIU-IND is the nodal agency for:",o:["FEMA","PMLA","IBC","Banking Regulation Act"],a:1,e:"FIU-IND is the nodal agency for PMLA."},
{q:"Bimal Jalan Committee recommended:",o:["Banking reforms","Economic Capital Framework of RBI","Tax reforms","Insurance regulation"],a:1,e:"Bimal Jalan Committee: Economic Capital Framework and surplus transfer."},
{q:"Malegam Committee dealt with:",o:["Banking regulation","Microfinance sector regulations","Tax reforms","NPA management"],a:1,e:"Malegam Committee: microfinance sector regulations."},
{q:"Damodaran Committee focused on:",o:["NPA resolution","Customer service in banks","Tax reforms","Bank mergers"],a:1,e:"Damodaran Committee: customer service in banks."},
{q:"MUDRA Tarun category provides loans:",o:["Up to Rs 50000","Rs 50000-5 lakh","Rs 5-10 lakh","Rs 10-20 lakh"],a:2,e:"Tarun = Rs 5-10 lakh."},
{q:"MUDRA Tarun+ category provides loans:",o:["Up to Rs 5 lakh","Rs 5-10 lakh","Rs 10-20 lakh","Above Rs 20 lakh"],a:2,e:"Tarun+ = Rs 10-20 lakh (new category)."},
{q:"PM Vishwakarma Scheme provides loans at:",o:["3% interest","5% interest","7% interest","10% interest"],a:1,e:"PM Vishwakarma: collateral-free loans at 5% interest."},
{q:"Sukanya Samriddhi Yojana is for:",o:["Senior citizens","Girl child below 10 years","Farmers","Disabled persons"],a:1,e:"SSY is for girl child below 10 years."},
{q:"Ayushman Bharat provides health cover of:",o:["Rs 1 lakh","Rs 2 lakh","Rs 5 lakh","Rs 10 lakh"],a:2,e:"PMJAY provides Rs 5 lakh/family/year health cover."},
{q:"PMSBY, PMJJBY and APY were all launched on:",o:["28 August 2014","9 May 2015","5 April 2016","1 July 2015"],a:1,e:"All three launched on 9 May 2015."},
{q:"GSTN is:",o:["GST tribunal","IT backbone of GST portal","GST council subsidiary","Tax collection agency"],a:1,e:"GSTN = Non-profit company managing the GST portal."},
{q:"In GST 2.0, education services fall under:",o:["0%","5%","18%","40%"],a:0,e:"Education services under 0% (NIL) slab."},
{q:"In GST 2.0, cement falls under:",o:["0%","5%","18%","40%"],a:2,e:"Cement falls under 18% in GST 2.0."},
{q:"RBI Foundation Day is on:",o:["1 January","1 April","1 July","12 July"],a:1,e:"1 April is RBI Foundation Day."},
{q:"GST Day is observed on:",o:["1 April","1 July","22 September","19 July"],a:1,e:"1 July is GST Day."},
{q:"NABARD Foundation Day is:",o:["1 April","1 July","12 July","19 July"],a:2,e:"12 July is NABARD Foundation Day."}
];
var ans={},bk={},tot=qs.length,cor=0;
function render(list){var h='';list.forEach(function(q){var i=qs.indexOf(q);h+='<div class="qc" id="q'+i+'"><button class="bm'+(bk[i]?' a':'')+'" onclick="tBk('+i+')">🔖</button><div class="qn">Q'+(i+1)+'/'+tot+'</div><div class="qt">'+q.q+'</div>';q.o.forEach(function(o,j){h+='<button class="ob" id="o'+i+'_'+j+'" onclick="chk('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>';});h+='<div class="ex" id="ex'+i+'">💡 '+q.e+'</div></div>';});document.getElementById('qA').innerHTML=h;for(var k in ans){var i=+k,a=ans[k];document.querySelectorAll('#q'+i+' .ob').forEach(function(b){b.style.pointerEvents='none';});document.getElementById('o'+i+'_'+a).classList.add(a===qs[i].a?'c':'w');document.getElementById('o'+i+'_'+qs[i].a).classList.add('sh');document.getElementById('ex'+i).style.display='block';}}
function chk(i,j){if(ans[i]!==undefined)return;ans[i]=j;var ok=j===qs[i].a;if(ok)cor++;document.getElementById('o'+i+'_'+j).classList.add(ok?'c':'w');if(!ok)document.getElementById('o'+i+'_'+qs[i].a).classList.add('sh');document.getElementById('ex'+i).style.display='block';document.querySelectorAll('#q'+i+' .ob').forEach(function(b){b.style.pointerEvents='none';});document.getElementById('score').textContent=cor+'/'+tot;document.getElementById('pct').textContent=Math.round(cor/tot*100)+'%';localStorage.setItem('test_A6_last',JSON.stringify({s:cor,t:tot,d:new Date().toLocaleDateString()}));}
function tBk(i){bk[i]=!bk[i];document.querySelector('#q'+i+' .bm').classList.toggle('a');localStorage.setItem('bk_A6',JSON.stringify(bk));}
function shuffle(){qs=qs.slice().sort(function(){return Math.random()-0.5;});ans={};cor=0;document.getElementById('score').textContent='0/'+tot;document.getElementById('pct').textContent='0%';render(qs);}
function showBk(){var b=qs.filter(function(q){return bk[qs.indexOf(q)];});if(!b.length){alert('No bookmarks yet!');return;}render(b);}
var sv=localStorage.getItem('bk_A6');if(sv)bk=JSON.parse(sv);render(qs);
</script>
